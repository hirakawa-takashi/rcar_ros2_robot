  settings:
    - {name: 材料, value: 全部品 PLA で印刷できる（バンパーの板ばねのひずみ約 1.1 %、カバーのフック約 0.9 %。どちらも PLA の降伏ひずみ約 2 % の半分ほど）。PLA は 55〜60 ℃ で柔らかくなるので、夏の車内など熱いところに置かない。カバーを付けて長く動かすときは、Pi の上のラズパイ台とカバーが熱で変形しないか確かめる}
    - {name: ノズル / 積層ピッチ, value: 0.4 mm / 0.2 mm（目安）}
    - {name: 壁, value: 3 周以上（ねじ込み穴のまわりを厚くするため）。板ばね 0.8 mm は壁 2 周だけでできる}
    - {name: 充填, value: 20〜30 %（目安）}
    - {name: サポート, value: 不要（全部品、STL の向きのまま印刷）。カバーは上面を下にして印刷するので、窓の上辺（Z 方向の穴の天井）は 24 mm 以下のブリッジになる}
