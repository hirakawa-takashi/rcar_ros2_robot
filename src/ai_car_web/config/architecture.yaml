  - {place: ラズパイ, name: drive_mode_node, file: src/ai_car_web/ai_car_web/drive_mode_node.py, role: 手動・自動・停止の切り替えと /cmd_vel の選択}
  - {place: ラズパイ, name: motor_driver_node, file: src/ai_car_web/ai_car_web/motor_driver_node.py, role: /cmd_vel → Motor HAT（メカナム逆運動学）}
  - {place: ラズパイ, name: encoder_odom_node, file: src/ai_car_web/ai_car_web/encoder_odom_node.py, role: 4 輪のエンコーダー → /odom と TF}
  - {place: ラズパイ, name: autonomy_node, file: src/ai_car_web/ai_car_web/autonomy_node.py, role: 自律走行（Level 1 は LiDAR で減速・停止・旋回、Level 2 は Nav2 の行き先へ）}
  - {place: ラズパイ, name: perception_node, file: src/ai_car_web/ai_car_web/perception_node.py, role: LiDAR と AI HAT+ の YOLO で障害物を判定}
  - {place: ラズパイ, name: mono_depth, file: src/ai_car_web/ai_car_web/mono_depth.py, role: 1 眼の奥行きの AI（SC-Depth v3）で低い物（表示だけ）}
  - {place: ラズパイ, name: seg_display_node, file: src/ai_car_web/ai_car_web/seg_display_node.py, role: TM1637 の 7 セグ LED に状態を出す（既定は使わない）}
  - {place: ラズパイ, name: lidar_watchdog_node, file: src/ai_car_web/ai_car_web/lidar_watchdog_node.py, role: /scan が止まったら rplidar・USB をつなぎ直す}
