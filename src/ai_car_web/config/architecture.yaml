# プロジェクト説明（ダッシュボード「プロジェクト説明」ボタン）の構成定義。
# dashboard_node が GET /api/architecture で返す。しきい値・タイムアウトは
# dashboard.yaml の実値を `param:` 参照で埋め込む（{node}.{parameter}）。

overview:
  video: overview_tab_yukkuri.mp4
  title: AI-CAR
  subtitle: Raspberry Pi 5 + ROS 2 Jazzy のメカナム 4 輪自律走行ロボット
  developer: ひらかわたかし
  developer_github: hirakawa-takashi
  purpose:
    - Raspberry Pi 5（8GB）上で ROS 2 Jazzy を動かし、LiDAR・カメラ・IMU を使って自律走行するロボットカーを作る
    - Web ダッシュボード（FastAPI）でテレメトリ表示・手動操作・システム監視・配線図の確認を行う
    - 1 ノード 1 責務、既存の動作確認済みコードは削除しない、Topic / Launch の変更はユーザー承認制
  current_level:
    label: Level 2（Nav2 で地図の行き先へ）＋ Level 1（LiDAR 反応型）
    detail: 行き先がないときは Level 1（前進 → 接近で減速 → 停止距離内なら空いている側へ旋回、地図なし）。ダッシュボードの地図をクリックすると Nav2 が道を考え、「ここへ行く」で自動にして slam_toolbox の地図と自己位置で行き先へ向かう（Level 2）。どちらも drive_mode_node の 360° の見張り・段差の止めを通る
  milestones:
    - {state: done, text: Web ダッシュボード（カメラ / LiDAR / CPU / AI HAT+ / IMU / GPIO / Motor HAT）}
    - {state: done, text: 障害物判定（LiDAR + Hailo-8 物体検出）とサーマル制御}
    - {state: done, text: F710 ゲームパッド手動操作}
    - {state: done, text: 運転モード管理（手動 / 自動 / 停止）と Level 1 自律走行}
    - {state: done, text: モーター制御ノード（/cmd_vel → Motor HAT、メカナム逆運動学）}
    - {state: done, text: エンコーダー読み取り・オドメトリ（/odom）}
    - {state: done, text: SLAM（slam_toolbox、/odom つき）}
    - {state: done, text: LiDAR 360° の見張り（動く向き・回る向きに物が近ければ止める）}
    - {state: done, text: IMU で向きを保ってまっすぐ走る（heading_hold）}
    - {state: done, text: スタックちゃんに話して走る（「前に 1 メートル進んで」など）}
    - {state: done, text: Level 2 自律走行（Nav2 による地図ベースのナビゲーション。床で試走して、まだ行っていない所を回る探索に使っている）}
    - {state: done, text: 'Level 2: 地図の緑の点（名前つきの場所）を順に回る（「台所、玄関の順で移動して」。いちばん短い道で、ふさがったらまわり道を 3 回までさがす。道がなければそこで止まる。床ではまだ試していない）'}
    - {state: done, text: 'Level 3: パトロール（「パトロールして」。地図の全部を 1.5 m ごとの見る所と緑の点で回り、4 方向を見て、人（YOLO）・床の物（LiDAR と地図）・新しい段差を報告する。行けない所はとばす。15 分まで。床ではまだ試していない）'}
    - {state: done, text: 'Level 3: 地図作り（「新しい地図を作る」で、北をはかってから、まだ見ていない所を自分で回って地図を作る。地図は北を上に出す。床ではまだ試していない）'}
    - {state: done, text: 'LiDAR のよごれチェック（3 秒はかって、返る点が 65% より少ないか 2.5 m より遠くが見えないと、地図作り・パトロール・探してを始めず「LiDAR のレンズをふいてください」と知らせる。走っているあいだ 30 秒続けて悪いときも知らせる）'}
    - {state: todo, text: 'Level 3: パトロールで、ふだんの写真とくらべて、いつもとちがう所を見つける（B）'}
  stack:
    - {name: Raspberry Pi 5 8GB, role: メインボード（Ubuntu 24.04）}
    - {name: ROS 2 Jazzy (ros-base), role: ミドルウェア}
    - {name: FastAPI + uvicorn, role: Web ダッシュボード / REST / WebSocket}
    - {name: HailoRT 4.24, role: AI HAT+ 推論（YOLOv8m。カメラの絵に物の名前を出すだけ。速さには使わない）}
    - {name: libcamera (rpicam), role: Camera Module 3 Wide 取り込み（camera_ros）}
    - {name: systemd ai-car-dashboard.service, role: 起動時の自動起動（Restart=always）}

system:
  video: system_tab_yukkuri.mp4
  summary:
    - AI-CAR（Raspberry Pi 5）・ミニコン（Jetson Orin Nano Super）・パソコン（Windows 11 の WSL Ubuntu、RTX 4080 SUPER）・M5 スタックちゃんを、家の Wi-Fi と Tailscale でつなぐ。ローカルのときはクラウドを使わず、家の中で動かす
    - AI-CAR は走る・測る・止まるを受け持つ。安全の判定（LiDAR 360° の見張り・前後の段差センサー・指令の途絶）は AI-CAR の中だけで行い、ほかの機械が止まっても安全に止まる
    - ミニコンは重い AI（声→文字・会話・文字→声、言葉で物を探す NanoOWL）を受け持つ。結果は表示と命令だけで、AI-CAR の安全の判定は変えない
    - パソコンを選ぶと（ダッシュボードのボタンか「パソコンにして」）、声→文字・会話・文字→声をもっと大きい AI でパソコンがする。パソコンが止まっていれば、自動でミニコンにもどる
    - M5 スタックちゃんは顔・耳・口（画面・マイク・スピーカー・首振り）。つなぐ先はミニコン（jetson-stackchan.service）で、考えるのはミニコンかパソコン。ミニコンが落ちたら、パソコン（pc-stackchan.service）に直接つないで、パソコンだけで話す
  network: 家の Wi-Fi と Tailscale（AI-CAR 100.70.35.31、ミニコン 100.111.231.54、パソコン 100.86.172.21）。AI-CAR のダッシュボードは 8080 番
  devices:
    - id: ai_car
      label: AI-CAR
      sub: Raspberry Pi 5 8GB / ROS 2 Jazzy
      state: done
      items:
        - LiDAR（A1M8）で障害物までの距離
        - Camera Module 3 Wide（960×540・30 fps）
        - 落下防止センサー（VL53L1X）前後 2 個で段差を見る（20 Hz）
        - 運転モード・自律走行・安全ガード（LiDAR 360° の見張り）
        - IMU（BNO055）で向きを保ってまっすぐ走る
        - ダッシュボード（8080 番）
    - id: jetson
      label: ミニコン（Jetson Orin Nano Super）
      sub: JetPack 6.2 / メモリ 8GB / 25W
      state: done
      items:
        - 声→文字（whisper-server、whisper.cpp small・GPU）・会話（Ollama の qwen2.5:3b）・文字→声（Kokoro・GPU）。スタックちゃんの会話に使う（jetson-stackchan.service）
        - スタックちゃんの受け口（stackchan_bridge）。「ミニコンにして」「パソコンにして」で考える所を、「ネットにして」「ローカルにして」で会話の AI（ネットの XiaoZhi か家の AI）を切り替える。2 つは別々に選べる。パソコンのときの「ネット」は、会話はパソコンの AI のまま、天気・ニュースなど新しいことだけミニコンがネットで調べて渡す。声を選ぶと話し方・性格もその声のキャラクターになる
        - 「前に 1 メートル進んで」「右に 90 度回って」「止まって」を AI-CAR の速度の指令にする。進んだ距離はエンコーダー、回った角度は IMU で見て止める
        - NanoOWL で段ボール箱・袋などを探す（jetson-owl.service）。メモリを空けるため 2026/10 から止めている
        - 声で覚えた物を探す（jetson-finder.service、NanoOWL の「画像で探す」）。「覚えて」でカメラのまん中の物の見た目を覚え（場所は覚えない）、物を動かしてから「探して」で、最後に覚えた物を自動走行で部屋を回って探す。点 0.9 以上が 3 回中 2 回なら車を止めて「見つけました」と言う。名前つき（「これは〇〇、覚えて」「〇〇を探して」）も使える。5 分で見つからなければ止める
        - 温度・メモリ・電力・AI の部品・セキュリティ更新の状況を 1 秒ごとに AI-CAR へ送る（jetson-status.service）
        - Ubuntu のセキュリティ更新だけを毎日自動で入れる（JetPack は外す、自動の再起動はしない）
    - id: stackchan
      label: M5 スタックちゃん
      sub: M5Stack CoreS3 / 純正ファームウェア 1.5.1（行き先を Jetson に）
      state: done
      items:
        - 画面の顔・マイク・スピーカー・首振り（左右・上下のサーボ）は純正のまま
        - 会話の AI Agent は Jetson の受け口（OTA 8003・WebSocket 8000）につなぐ。自動更新はしない
        - ダッシュボードのスタックちゃんのカードに、今の様子・最後の会話・IP アドレスを出す
        - "カメラ（GC0308）: 「撮影して」で 5 秒数えて撮り、320×240 の JPEG をダッシュボードに出す（見守りでも 2 秒に 1 枚もらって顔を見る）"
    - id: pc
      label: パソコン
      sub: WSL Ubuntu 26.04 / RTX 4080 SUPER 16GB
      state: done
      items:
        - 声→文字 whisper large-v3・会話 qwen2.5:14b（GPU）・文字→声 VOICEVOX（43 人からダッシュボードで選ぶ、CPU）
        - 温度・負荷率・メモリ・更新を 1 秒ごとに AI-CAR へ送る（pc-status.service）
    - {id: browser, label: ブラウザ（PC・スマホ）, sub: ダッシュボード・手動操作, state: done}
    - {id: person, label: 家の人, sub: 声で話しかける, state: done}
  links:
    - {from: ai_car, to: jetson, short: 画像, desc: カメラの画像（JPEG 640×360）。Jetson が 1 秒に 5 回取りに行く, via: 'GET /api/camera/snapshot', state: done}
    - {from: jetson, to: ai_car, short: 名前・位置, desc: 見つけた物の名前・信頼度・画面の位置。AI-CAR が LiDAR の距離を付けて表示する（速度には使わない）, via: 'POST /api/jetson/detections（API トークン）', state: done}
    - {from: jetson, to: ai_car, short: 命令, desc: 声の命令（「前に 1 メートル進んで」「止まって」）を 1 秒に 5 回の速度の指令にする。AI-CAR の安全ガード（LiDAR 360°・段差・途絶）はそのまま効き、Jetson が止まってもラズパイが 1 秒で止める。走るあいだは /api/status で進んだ距離・向きを見る, via: 'POST /api/cmd_vel・/api/stop、GET /api/status（API トークン）', state: done}
    - {from: stackchan, to: jetson, short: 声, desc: マイクの声（Opus 16 kHz）。カメラの映像はダッシュボードを見ている間だけ（HTTP 8003 /camera/frame）, via: WebSocket 8000（XiaoZhi の形、jetson-stackchan.service）, state: done}
    - {from: jetson, to: stackchan, short: 返事, desc: 返事の声（Opus 24 kHz）と顔の表情（考え中・笑顔）, via: WebSocket 8000（XiaoZhi の形、jetson-stackchan.service）, state: done}
    - {from: jetson, to: ai_car, short: 状態, desc: 温度・メモリ・GPU・電力・AI の部品・更新の状況。ダッシュボードの Jetson カードに出す（5 秒届かないと未接続、速度には使わない）, via: 'POST /api/jetson/status（API トークン）', state: done}
    - {from: jetson, to: pc, short: 聞き取り・返事・声, desc: パソコンを選んでいて、動いているときだけ。マイクの声を文字にし（whisper large-v3）、返事を作り（qwen2.5:14b）、返事の声を作る（VOICEVOX のえらんだ声。ネットの会話のときも、ネットの声のかわりに読む）。10 秒ごとに見て、だめならミニコン, via: 'HTTP 8178・11434・50021（Tailscale）', state: done, both: true}
    - {from: pc, to: ai_car, short: 状態, desc: 温度・負荷率・メモリ・電力・AI の部品・更新の状況。パソコンを選んでいるとき、ダッシュボードのミニコンのカードをパソコンの値で出す, via: 'POST /api/mypc/status（API トークン）', state: done}
    - {from: browser, to: ai_car, short: 見る・操作, desc: ダッシュボードの表示と手動操作, via: 'HTTP 8080・WebSocket /ws', state: done, both: true}
    - {from: person, to: stackchan, short: 話す, desc: 「スタックちゃん」と呼んで会話モードにし、声で話しかけて返事を聞く（30 秒だまると「じゃあ、またね。」）, via: 声, state: done, both: true}

hardware:
  video: hardware_tab_yukkuri.mp4
  center: {id: pi5, label: Raspberry Pi 5, sub: 8GB / Ubuntu 24.04 / ROS 2 Jazzy}
  devices:
    - {id: ai_hat, label: AI HAT+, sub: Hailo-8 NPU 26 TOPS, bus: PCIe（GPIO ヘッダー経由）, power: 5V, jump: hat, side: top}
    - {id: motor_hat, label: Adafruit Motor HAT, sub: PCA9685 + TB6612 ×2, bus: I2C 0x60, power: 12V（モーター）, jump: motor, side: right}
    - {id: motors, label: 520 エンコーダー付きモーター ×4, sub: メカナムホイール M1〜M4, bus: Motor HAT M+ / M− ＋ エンコーダー A/B → Pi GPIO, power: 12V, jump: motor, side: right}
    - {id: lidar, label: RPLIDAR A1M8, sub: 2D LiDAR 最大 8 m / 約 8 Hz, bus: USB シリアル（CP2102 115200bps）, power: 5V, side: left}
    - {id: camera, label: Camera Module 3 Wide（SC0874）, sub: IMX708 / 横 102° / 960×540 30fps, bus: CSI（フラットケーブル）, power: 3V3（Pi から）, side: left}
    - {id: imu, label: 加速度センサー（GY-BNO055）, sub: 9 軸 IMU 20 Hz（AMG モード、向きはラズパイで計算）, bus: I2C バス 1 / 0x29, power: 3V3, jump: gpio, side: bottom}
    - {id: gamepad, label: Logitech F710, sub: XInput /dev/input/js0, bus: USB（無線レシーバー）, power: 5V, side: left}
    - {id: tof, label: 落下防止センサー（VL53L1X）×2, sub: Dovhmoh ToF 測距 / 前後バンパー 45° 前傾, bus: I2C バス 1 / 0x30（前）・0x31（後）＋ XSHUT GPIO17 / GPIO27, power: 3V3, jump: gpio, side: bottom}
    - {id: battery_pi, label: バッテリー（Pi 5 用）, sub: CIO SMARTCOBY Pro SLIM 35W / PD 12V, bus: 12V → DROK（Pi 5・センサー用 5V）, power: 12V, feeds: drok, side: top}
    - {id: battery_motor, label: バッテリー（モーター用）, sub: CIO SMARTCOBY Pro SLIM 35W / PD 12V, bus: 12V → Motor HAT のみ（Pi 側には接続しない）, power: 12V, feeds: motor_hat, side: top}
    - {id: drok, label: DROK 降圧コンバーター, sub: 12V → 5.2V / 5A（B09JKHD3SH）, bus: USB-A → Pi 5 USB-C（PD なし。ラズパイは 3 A の電源と見る）, power: 5V, side: top}
  power_wiring:
    summary:
      - バッテリーは 2 個。1 個はラズパイ側（DROK で 5.2V にしてラズパイへ）、もう 1 個はモーター側（12V のまま Motor HAT へ）。2 つの 12V の線どうしはつながない
      - バッテリーの USB-C 口は 2 つあり、1 つを車に、もう 1 つを充電に使う
      - 12V は、USB-C のプラグの中の PD トリガー（小さな部品）が、CC（合図の線）でバッテリーと話して出してもらう。CC があるのは USB-C のところだけで、丸プラグや端子台の線は＋と−の 2 本だけ
      - 線の色は 赤 = 12V、オレンジ = 5V、灰色 = CC（合図の線。電気はほとんど流れない）。点線は「予定（部品待ち）」
      - 箱の下の「入」「出」は、その部品の端子の形。オス = 差しこむ側（プラグ）、メス = 差しこまれる側（口・ジャック）
    systems:
      - title: ラズパイ側（バッテリー 1 → DROK → Raspberry Pi 5）
        parts:
          - {label: バッテリー 1, sub: CIO SMARTCOBY Pro SLIM 35W / USB-C PD, out: USB-C メス（口）}
          - {label: USB スイッチ（下）, sub: LOYELEY 28 cm / ＋（VBUS）だけ切る, in: USB-C オス, out: USB-C メス}
          - {label: PD トリガーケーブル, sub: SZSL 12V 固定 3A / 1 m（B0D3QG33J7）, in: USB-C オス / （中に PD トリガー）, out: 丸プラグ オス / 5.5×2.5 mm・中が＋}
          - {label: DROK 降圧コンバーター, sub: 12V → 5.2V / 5A（B09JKHD3SH）, in: DC ジャック メス / （穴の大きさ 未確認）, out: USB-A メス}
          - {label: USB ケーブル, sub: USB-A → USB-C / 30 cm くらい, in: USB-A オス, out: USB-C オス / （L 字がおすすめ）}
          - {label: Raspberry Pi 5, sub: 電源の USB-C 口 / PD なし・3 A と見る, in: USB-C メス / （電源の口・5V だけ）}
        wires:
          - {power: 12V, joint: バッテリーの USB-C 口 ← スイッチの USB-C プラグ, desc: "VBUS（＋）・GND（−）・CC（合図）がそのまま通る。はじめは 5V で、PD トリガーとの話し合いのあと 12V になる"}
          - {power: 12V, joint: スイッチの USB-C ← PD トリガーケーブルの USB-C プラグ（オス）, desc: プラグの中に PD トリガーがある。ここで「12V ください」とたのむ}
          - {power: 12V, joint: 丸プラグ（オス、5.5 × 2.5 mm、中が＋）→ DROK の DC ジャック（メス）, desc: "ケーブルの中は＋（赤）と−（黒）の 2 本だけ。中が−（センターマイナス）のケーブルは使わない。DROK のジャックの穴の大きさはまだ実物で測っていない（3D の説明では 5.5 × 2.1 mm と読んでいる）"}
          - {power: 5V, joint: DROK の USB-A 口（メス）← USB-A → USB-C ケーブルの USB-A プラグ, desc: "5.2V / 最大 5A。30 cm くらい（ラズパイ側は L 字がおすすめ）"}
          - {power: 5V, joint: ケーブルの USB-C プラグ → Raspberry Pi 5 の電源の USB-C 口, desc: "PD のやりとりはないので、ラズパイは「3 A の電源」と見る（usb_max_current_enable=1 で USB 機器に 1.6 A まで）。AI HAT+・カメラ・LiDAR・IMU・落下防止センサー・エンコーダーの電気もここから"}
        notes:
          - 12V の PD トリガーケーブルを、ラズパイの USB-C 口に直接さすと、ラズパイがこわれる。② と ⑤ は同じ USB-C の形なので、まちがえないようにする
          - DROK の USB-A（出力）に 12V を入れない
          - いまの困りごと：スイッチは＋（VBUS）だけを切って CC はつないだまま。充電のあと OFF → ON にしても、バッテリーが「新しくつながった」と気づかず、12V を出しなおさないことがある（USB-C を抜いて差すと直る）。下の「予定」で直す
      - title: モーター側（バッテリー 2 → Motor HAT → モーター ×4）
        parts:
          - {label: バッテリー 2, sub: CIO SMARTCOBY Pro SLIM 35W / USB-C PD, out: USB-C メス（口）}
          - {label: USB スイッチ（上）, sub: LOYELEY 28 cm / ＋（VBUS）だけ切る, in: USB-C オス, out: USB-C メス}
          - {label: PD トリガーケーブル, sub: 12V 固定 / USB-C プラグの中で 12V をたのむ, in: USB-C オス / （中に PD トリガー）, out: ＋ 赤・− 黒 / （先の形 未確認）}
          - {label: Adafruit Motor HAT, sub: PCA9685 + TB6612 ×2 / I2C 0x60, in: 電源の端子台 / ＋・−（ねじ）, out: M1〜M4 の端子台 / 各 2 本（ねじ）}
          - {label: モーター ×4, sub: 520 エンコーダー付き / M1〜M4, in: モーター線 / 黒 Motor+・赤 Motor−}
        wires:
          - {power: 12V, joint: バッテリーの USB-C 口 ← スイッチの USB-C プラグ, desc: ラズパイ側と同じ。VBUS・GND・CC がそのまま通る}
          - {power: 12V, joint: スイッチの USB-C ← PD トリガーケーブルの USB-C プラグ（オス）, desc: プラグの中の PD トリガーが 12V をたのむ}
          - {power: 12V, joint: ケーブルの＋（赤）・−（黒）→ Motor HAT の電源の端子台, desc: "＋と−を逆にしない。Motor HAT のモーターの電気は 4.5〜13.5V まで（12V は入る）。ケーブルの先の形（丸プラグか、線のままか）は、まだ写真で確かめていない"}
          - {power: 12V, joint: Motor HAT の M1〜M4 の端子台 → 各モーター, desc: "黒 = Motor+、赤 = Motor−（6 本の線の内わけは「配線詳細」の Motor HAT の図）。速さは PWM（電気を細かく入れたり切ったり）で変える"}
        notes:
          - 12V はモーターを回すためだけ。ラズパイにはつながない
          - Motor HAT の PCA9685（モーターに命令を出す IC）の電気は、ラズパイの 40 ピンの 3V3 からもらう。なので、モーター側のスイッチが OFF でも、ラズパイからは Motor HAT が見える（I2C 0x60）が、車輪は回らない
          - モーターのエンコーダー（回った量を数える部品）の電気も、ラズパイの 3V3 から
      - title: 予定：CC も切るスイッチ（ラズパイ側・モーター側とも同じ。部品待ち）
        state: plan
        bypass: {from: 2, to: 4, power: 12V, label: VBUS（＋）・GND（−）は基板 A → 基板 B へ太い線で直結（スイッチを通さない）}
        parts:
          - {label: バッテリー, sub: USB-C 口, out: USB-C メス}
          - {label: C-C ケーブル 15 cm, sub: ELECOM / MPA-CCECSS015BK, in: USB-C オス, out: USB-C オス}
          - {label: 基板 A, sub: PENGLIN, in: USB-C メス, out: はんだの穴 / VBUS・GND・CC1・CC2}
          - {label: 6 ピンスイッチ, sub: CC1・CC2 だけ切る / ロック付き, in: 各列のまん中の足 / （共通）, out: 各列の ON 側の足 / （ロックで鳴る方）}
          - {label: 基板 B, sub: PENGLIN, in: はんだの穴 / VBUS・GND・CC1・CC2, out: USB-C メス}
          - {label: PD トリガーケーブル, sub: 今のものをそのまま, in: USB-C オス / （中に PD トリガー）, out: 丸プラグ オス / または ＋ 赤・− 黒}
          - {label: DROK / Motor HAT, sub: 上の ③ から先は / 今と同じ, in: DC ジャック メス / または 端子台（ねじ）}
        wires:
          - {power: 12V, joint: バッテリーの USB-C 口 ← C-C ケーブル, desc: 100W 対応の短いケーブル}
          - {power: 12V, joint: C-C ケーブル → 基板 A の USB-C 口, desc: 基板 A は線をはんだ付けで出すための小さな板}
          - {power: CC, joint: 基板 A の CC1・CC2 → スイッチ（1 列目 = CC1、2 列目 = CC2）, desc: "各列のまん中の足（共通）と、ロックしたときにつながるはしの足を使う。VBUS（＋）と GND（−）は、スイッチを通さず、太い線（0.5 mm²）で基板 A から基板 B へまっすぐつなぐ"}
          - {power: CC, joint: スイッチ → 基板 B の CC1・CC2, desc: OFF にすると CC が切れて、バッテリーには「抜いた」と同じに見える。ON で「差した」と同じになり、12V を出しなおす}
          - {power: 12V, joint: 基板 B の USB-C 口 ← PD トリガーケーブルの USB-C プラグ, desc: PD トリガーはプラグの中なので、ケーブルを短く切っても CC には関係しない}
          - {power: 12V, joint: PD トリガーケーブル → DROK / Motor HAT, desc: 今と同じ}
        notes:
          - 基板に CC の 5.1 kΩ の抵抗（「512」と書いた部品）があると、PD トリガーとじゃまし合うことがある。はんだ付けの前に基板の表と裏の写真で確かめる
          - はんだ付けのあと、DROK・Motor HAT にはつながずに、テスターで VBUS と CC1・CC2・GND がつながっていない（ピーと鳴らない）ことを確かめる
          - 次に、PD トリガーケーブルの先をテスターで測り、スイッチ ON で約 12V、OFF で 0V になれば合格。そのあと DROK → ラズパイ、Motor HAT の順につなぐ
          - いまの LOYELEY スイッチ 2 個は外す。電池 2 個分で、スイッチ 2 個・基板 4 枚・C-C ケーブル 2 本

print3d:
  dir: hardware/3d/battery_lidar_mount
  source: battery_lidar_mount.scad
  summary:
    - 天板（154 × 200 mm）の上に載せる 6 種類・8 個の部品。底板にはモーターが付いているので使わない
    - 試験台（test_stand）は車体に付けない治具。カバーとバンパーを付けたまま車体を載せ、車輪を浮かせて試す
    - 組み立て図の車輪・モーター・モーターの台は印刷しない購入品の参考の形（hardware/3d/drivetrain/drivetrain.scad、OSOYOO の図面の寸法）
    - 前側にバッテリー 2 個の箱とふた（LiDAR・Camera Module 3 Wide・IMU・DROK を取り付け）、後ろ側に Pi 5 の 3 段（高さ 45 mm）、前後に衝撃を逃がすバンパー（落下防止センサー VL53L1X 付き）。全体を上面カバーで覆い、左右のフックで天板の端の裏に引っかける（工具不要）
    - 図とダウンロードする STL は、どれも印刷する向き（STL の向き）のまま。寸法は STL から計算した外形（mm）
    - 部品の寸法はデータシートと商品画像から読み取ったもので、実物ではまだ確かめていない
  parts:
    - id: box
      label: バッテリー箱
      file: box.stl
      qty: 1
      color: '#35d6ff'
      material: PLA / PETG
      orient: フランジ（天板に当たる面）を下
      holds:
        - CIO SMARTCOBY Pro SLIM ×2（重ねて収納、ふたを外して上から出し入れ。右の開口は充電口とケーブル用）
        - DROK 降圧コンバーター（後ろの壁、結束バンド 1 本）
        - 底の前の 2 か所に、天板の上に 3 mm 出ているモーター取付ネジのくぼみ（29 × 29 × 3.5 mm。そのため床は 5 mm）
      mount: 天板の前側 4 穴に、今のネジより 3 mm 長いネジで留める
    - id: lid
      label: ふた + LiDAR 台
      file: lid.stl
      qty: 1
      color: '#f0a040'
      material: PLA / PETG
      orient: 板を下
      holds:
        - RPLIDAR A1M8（柱 4 本、ふたの裏から M2.5 × 8 ×4）
        - カメラの板（cam_mount）を留める前端の柱 2 本（M3 の下穴）と、前の面のカメラの M2 のナット・ネジの先の逃げ穴（Ø6.5、深さ 4 mm ×2）
        - 加速度センサー（GY-BNO055、12 × 20 mm、ピン下向き。LiDAR のヘッドの下、右寄り。四方を壁で囲んだ高さ 25 mm の台の受けに両面テープ）
        - カメラのフラットケーブル（ふたの上の結束バンド用ブリッジ 2 か所）
        - 上のバッテリーの残量表示の窓（15 × 14 mm）
        - LiDAR のハーネス（後ろ端の結束バンド用ブリッジ）
      mount: 箱のボスに M3 × 12 ×4（LiDAR を先にふたへ留める）
    - id: pi_base
      label: ラズパイ台
      file: pi_base.stl
      qty: 1
      color: '#43c47a'
      material: PLA / PETG
      orient: 板を下
      holds:
        - Raspberry Pi 5 + AI HAT+ + Motor HAT（3 段 45 mm、M2.5 ×4）
        - 後ろ左の腕の底に、モーター取付ネジのくぼみ（29 × 29 × 3.5 mm）
      mount: 天板の後ろ側 4 穴に、今のネジより 3 mm 長いネジで留める
    - id: cam_mount
      label: カメラの板（Camera Module 3 Wide）
      file: cam_mount.stl
      qty: 1
      color: '#f4f4f4'
      material: PLA / PETG
      orient: 裏を下（STL の向きのまま）
      holds:
        - Camera Module 3 Wide（基板 25 × 23.9 mm、フラットケーブルの端子を下。ケーブルは折り返して基板の裏を上へ。四隅の穴に前から M2 × 6 ×4）
        - 板の裏に M2 ナットの六角のくぼみ ×4（二面幅 4.4 mm、深さ 1.8 mm。ナットが裏から出ない）
      mount: 裏をふたの前端の面に当て、左右の耳をふたの前端の柱に M3 × 8 ×2
    - id: bumper
      label: 前後バンパー（前後共通）
      file: bumper.stl
      qty: 2
      color: '#e05b8a'
      material: PLA / PETG（板ばねは 0.8 mm で、ひずみ約 1.1 %）
      orient: 上面を下（STL の向きのまま）
      holds:
        - 落下防止センサー（VL53L1X）×1（進行方向へ 45° 傾けた受けに上から落とし込み、左右の耳で受ける。レンズのカバーは幅 13.4 mm の窓に入る。視野は前面の板の下を通る）
        - 板ばね 4 枚（0.8 mm）で前面の板が 4 mm 逃げ、ストッパー 6.8 mm で止まる
        - 手で触る縁は 1 mm の面取り
        - 左右の腕の下の爪が、前は箱のフランジの前の縁、後ろはラズパイ台の腕の端に当たり、ぶつかった力をネジではなく左右 2 か所の面で受ける
      mount: 前は箱のフランジ、後ろはラズパイ台の腕の上に重ねて共締め（ネジはさらに 4 mm 長く）。爪を縁の前（後ろ）に落とし込んでから締める
    - id: cover
      label: 上面カバー
      file: cover.stl
      qty: 1
      color: '#5c6b80'
      material: PLA / PETG（フックのひずみは約 0.9 %）
      orient: 上面を下（STL の向きのまま）
      holds:
        - 天板の上の部品全体を覆う（高さ 82.4 mm、上面は Pi 3 段の上端から 26 mm 上）。LiDAR は高さ 48 mm の柱に載り、取付面（90.4 mm）がカバーの上面より 8 mm 上なので、ヘッドは全部カバーの上に出る
        - 右側面の充電口（72 × 33 mm）から、カバーを付けたままバッテリーの USB-C に差せる
        - 前面にカメラの切り欠き（Camera Module 3 Wide の下。幅 40 mm で、壁の下の端から 40.4 mm まで（レンズの中心は 28.1 mm）。その上は壁）、後ろの壁の下に線の出口の切り欠き（24 × 10 mm）、Pi の上に六角の通気口、左の壁に Pi 5 の電源ボタンを押す穴（18 × 11 mm）、上面に「AI-CAR」の文字
        - LiDAR の右隣に、上のバッテリーの残量表示の窓（17 × 16 mm。ほぼ真上から見る）
        - 右の壁の Pi の横に、USB スイッチ 2 個のボタンとランプの窓（29 × 16 mm が上下 2 つ）。カバーを付けたまま指で押せる
        - 手で触る縁（外側の角と稜線、壁の下端、充電口のふち）は 1 mm の面取り
      mount: 工具不要。フックの後ろは、左が天板の後ろの端から 54 mm（電源ボタンの穴をよける）、右が 72 mm（USB スイッチの窓をよける）。前は左右とも前の端から 30 mm。右前のフック（充電口の下）は固定の爪なので、右側を先に斜めに入れて掛け、左側を押し下げると左の 2 個と右後ろのフックが外へたわんで天板の端の裏に掛かる。外すときは左の指かけを外へ引いて左側から持ち上げる
    - id: sw_holder
      label: USB スイッチの受け
      file: sw_holder.stl
      qty: 1
      color: '#e07b00'
      material: PLA / PETG
      orient: 背中を下（STL の向きのまま）。サポート不要
      holds:
        - LOYELEY の USB-C スイッチ（47.2 × 17.4 × 13.5 mm）×2 を、Pi の右に横にねかせて上下 2 段。受けはできるだけ後ろへ寄せ、カバーの後ろの壁とのあいだを 15 mm 空けて線を曲げる所にした（前にバッテリーの USB の線を通す）。下がバッテリー → DROK（ラズパイ）、上がバッテリー → Motor HAT（モーター）
        - ボタンはカバーの右の壁の窓から押せる（ボタンの先は壁の内側から 1 mm 手前）
        - 前後の端の壁に、線を通す幅 8 mm の切り欠き。床の下は天板から 9 mm 空けて、右の端に沿う線を通す
      mount: 天板の右側の 2 穴（X 145 / Y 90 mm はラズパイ台の腕の上で、前へ伸ばした腕で届く。X 143 / Y 11 mm は後ろのバンパーの腕の上）に、長い M4（前は 7.3 mm、後ろは 3.3 mm 長く）で共締め
    - id: test_stand
      label: 試験台（車輪を浮かせる台）
      file: test_stand.stl
      qty: 1
      color: '#d98c3a'
      material: PLA / PETG
      orient: 床板を下（STL の向きのまま。サポート不要）
      holds:
        - 車体に付けない治具。カバーとバンパーを付けたままの車体の、天板の 4 隅の下面（40 × 10.7 mm）を、床から 80 mm で受ける（車輪は約 10 mm 浮く）。4 隅の穴の下は Ø12 × 深さ 12 mm のくぼみでネジの先・ナットをよける
        - 左右の位置決めの壁（カバーの左右の壁の外側から 1 mm）。受け面の外側はカバーの壁の下端とバンパーから 1 mm 下げる
        - 4 隅の柱を厚さ 10 mm の床板でつないだ 1 個の部品（167.4 × 202 × 88 mm）。床板は外周の枠 8 mm と、斜めの格子のリブ 5 mm の中抜き。柱の内側に三角の補強
        - 車輪は直径 80.59 mm・幅 39.1 mm、車軸は天板の前後の端から 52 mm（OSOYOO の図面）。車輪の内側の面（カバーの壁の外側から 4 mm）は仮の値
      mount: 床に置き、車体を上から下ろして左右の壁の間に入れる（前後は摩擦で保持）
  refs:
