      label: モーターの台 ×4（購入品）
      file: holders.stl
      color: '#2f3440'
  assembly_views:
    - label: 組み立て図
      note: 天板（154 × 200 × 2 mm）の上に、カバー以外の 6 種類・7 個の部品を組み立てた位置で表示。天板の下に、車輪・モーター・モーターの台（購入品、OSOYOO の図面の寸法）も参考に表示（バッテリー・Pi・センサーなどほかの購入品は表示しない）
