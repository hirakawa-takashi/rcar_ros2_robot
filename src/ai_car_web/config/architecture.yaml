  - {place: ラズパイ, name: architecture, file: src/ai_car_web/ai_car_web/architecture.py, role: プロジェクト説明の構成の読み込み}
  - {place: ラズパイ, name: dev_diary, file: src/ai_car_web/ai_car_web/dev_diary.py, role: git の記録から開発日記を作る}
