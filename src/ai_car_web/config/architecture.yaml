# プロジェクト説明（ダッシュボード「プロジェクト説明」ボタン）の構成定義。
# dashboard_node が GET /api/architecture で返す。しきい値・タイムアウトは
# dashboard.yaml の実値を `param:` 参照で埋め込む（{node}.{parameter}）。

overview:
  title: AI-CAR
  subtitle: Raspberry Pi 5 + ROS 2 Jazzy のメカナム 4 輪自律走行ロボット
  purpose:
    - Raspberry Pi 5（8GB）上で ROS 2 Jazzy を動かし、LiDAR・カメラ・IMU を使って自律走行するロボットカーを作る
    - Web ダッシュボード（FastAPI）でテレメトリ表示・手動操作・システム監視・配線図の確認を行う
    - 1 ノード 1 責務、既存の動作確認済みコードは削除しない、Topic / Launch の変更はユーザー承認制
  current_level:
    label: Level 1（LiDAR 反応型・地図なし）
    detail: 前進 → 接近で減速 → 停止距離内なら空いている側へ旋回。地図・自己位置推定・経路計画は使わない
  milestones:
    - {state: done, text: Web ダッシュボード（カメラ / LiDAR / CPU / AI HAT+ / IMU / GPIO / Motor HAT）}
    - {state: done, text: 障害物判定（LiDAR + Hailo-8 物体検出）とサーマル制御}
    - {state: done, text: F710 ゲームパッド手動操作}
    - {state: done, text: 運転モード管理（手動 / 自動 / 停止）と Level 1 自律走行}
    - {state: done, text: ST7789 液晶の状態表示器}
    - {state: todo, text: モーター制御ノード（/cmd_vel → Motor HAT、メカナム逆運動学）}
    - {state: todo, text: エンコーダー読み取り・オドメトリ（/odom）}
    - {state: todo, text: SLAM（slam_toolbox）}
    - {state: todo, text: Level 2 自律走行（Nav2 による地図ベースのナビゲーション）}
  stack:
    - {name: Raspberry Pi 5 8GB, role: メインボード（Ubuntu 24.04）}
    - {name: ROS 2 Jazzy (ros-base), role: ミドルウェア}
    - {name: FastAPI + uvicorn, role: Web ダッシュボード / REST / WebSocket}
    - {name: HailoRT 4.24, role: AI HAT+ 推論（YOLOv8m）}
    - {name: libcamera (rpicam), role: カメラ v3 取り込み}
    - {name: spidev / libgpiod / Pillow, role: ST7789 液晶描画}
    - {name: systemd ai-car-dashboard.service, role: 起動時の自動起動（Restart=always）}

hardware:
  center: {id: pi5, label: Raspberry Pi 5, sub: 8GB / Ubuntu 24.04 / ROS 2 Jazzy}
  devices:
    - {id: ai_hat, label: AI HAT+, sub: Hailo-8 NPU 26 TOPS, bus: PCIe（GPIO ヘッダー経由）, power: 5V, jump: hat, side: top}
    - {id: motor_hat, label: Adafruit Motor HAT, sub: PCA9685 + TB6612 ×2, bus: I2C 0x60, power: 12V（モーター）, jump: motor, side: right}
    - {id: motors, label: 520 エンコーダー付きモーター ×4, sub: メカナムホイール M1〜M4, bus: Motor HAT M+ / M− ＋ エンコーダー A/B → Pi GPIO, power: 12V, jump: motor, side: right}
    - {id: lidar, label: RPLIDAR A1M8, sub: 2D LiDAR 最大 8 m / 約 8 Hz, bus: USB シリアル（CP2102 115200bps）, power: 5V, side: left}
    - {id: camera, label: カメラモジュール v3, sub: IMX708 960×540 30fps, bus: CSI, power: 5V, side: left}
    - {id: imu, label: 加速度センサー（GY-BNO055）, sub: 9 軸 IMU 20 Hz, bus: I2C バス 1 / 0x29, power: 3V3, jump: gpio, side: bottom}
    - {id: lcd, label: ディスプレイ（ZJY-IPS130-V2.0）, sub: ST7789 240×240 IPS 液晶, bus: SPI0 + GPIO23/24/25（BLK/RES/DC）, power: 3V3, jump: gpio, side: bottom}
    - {id: gamepad, label: Logitech F710, sub: XInput /dev/input/js0, bus: USB（無線レシーバー）, power: 5V, side: left}
    - {id: tof, label: 落下防止センサー（VL53L1X）×2, sub: Dovhmoh ToF 測距 / 前後バンパー 45° 前傾, bus: I2C バス 1 / 前 0x2A・後ろ 0x2B（XSHUT GPIO17・GPIO27）, power: 3V3, jump: gpio, side: bottom}
    - {id: battery, label: CIO SMARTCOBY Pro SLIM 35W ×2, sub: 10000mAh / USB-C PD 12V, bus: 12V → DROK（Pi 5・センサー用 5V）/ 12V → Motor HAT のみ, power: 12V, side: top}
    - {id: drok, label: DROK 降圧コンバーター, sub: 12V → 5.2V / 5A（B09JKHD3SH）, bus: USB-A → Pi 5 USB-C, power: 5V, side: top}

print3d:
  dir: hardware/3d/battery_lidar_mount
  source: battery_lidar_mount.scad
  summary:
    - 天板（154 × 200 mm）の上に載せる 5 種類・6 個の部品。底板にはモーターが付いているので使わない
    - 前側にバッテリー 2 個の箱とふた（LiDAR・カメラ・DROK を取り付け）、後ろ側に Pi 5 の 3 段（高さ 45 mm）と IMU・液晶の台、前後に衝撃を逃がすバンパー（VL53L1X 付き）。全体を上面カバーで覆い、左右のフックで天板の端の裏に引っかける（工具不要）
    - 図とダウンロードする STL は、どれも印刷する向き（STL の向き）のまま。寸法は STL から計算した外形（mm）
    - 部品の寸法はデータシートと商品画像から読み取ったもので、実物ではまだ確かめていない
  parts:
    - id: box
      label: バッテリー箱
      file: box.stl
      qty: 1
      color: '#35d6ff'
      material: PLA / PETG
      orient: フランジ（天板に当たる面）を下
      holds:
        - CIO SMARTCOBY Pro SLIM ×2（重ねて収納、右の開口から出し入れ）
        - DROK 降圧コンバーター（後ろの壁、結束バンド 1 本）
      mount: 天板の前側 4 穴に、今のネジより 3 mm 長いネジで留める
    - id: lid
      label: ふた + LiDAR 台
      file: lid.stl
      qty: 1
      color: '#f0a040'
      material: PLA / PETG
      orient: 板を下
      holds:
        - RPLIDAR A1M8（柱 4 本、ふたの裏から M2.5 × 8 ×4）
        - Camera Module 3（前端に立てた板、正立、M2 × 6 ×4）
        - カメラのフラットケーブル（基板の下から後ろへ水平に、板の下の窓とブリッジ 2 か所。途中で 45° に 2 回折って、バッテリーの残量表示の窓をよける）
        - 上のバッテリーの残量表示の窓（15 × 14 mm）
        - LiDAR のハーネス（後ろ端の結束バンド用ブリッジ）
      mount: 箱のボスに M3 × 12 ×4（LiDAR を先にふたへ留める）
    - id: pi_base
      label: ラズパイ台（IMU・液晶スタンド付き）
      file: pi_base.stl
      qty: 1
      color: '#43c47a'
      material: PLA / PETG
      orient: 板を下
      holds:
        - Raspberry Pi 5 + AI HAT+ + Motor HAT（3 段 45 mm、M2.5 ×4）
        - 加速度センサー（GY-BNO055、12 × 20 mm、ピン下向き。四方を壁で囲んだ高さ 25 mm の台の受けに両面テープ。線は Pi 側の壁の穴から出す）
        - ディスプレイ（ZJY-IPS130-V2.0、左右の溝に差し込み 30° 後傾。枠の底の下は台まで埋め、左右の支えまでベースを広げてある）
      mount: 天板の後ろ側 4 穴に、今のネジより 3 mm 長いネジで留める
    - id: bumper
      label: 前後バンパー（前後共通）
      file: bumper.stl
      qty: 2
      color: '#e05b8a'
      material: PLA / PETG（板ばねは 0.8 mm で、ひずみ約 1.1 %）
      orient: 上面を下（STL の向きのまま）
      holds:
        - 落下防止センサー（VL53L1X）×1（進行方向へ 45° 傾けた受けに上から落とし込む。視野は前面の板の下を通る）
        - 板ばね 4 枚（0.8 mm）で前面の板が 4 mm 逃げ、ストッパー 6.8 mm で止まる
        - 手で触る縁は 1 mm の面取り
        - 左右の腕の下の爪が、前は箱のフランジの前の縁、後ろはラズパイ台の腕の端に当たり、ぶつかった力をネジではなく左右 2 か所の面で受ける
      mount: 前は箱のフランジ、後ろはラズパイ台の腕の上に重ねて共締め（ネジはさらに 4 mm 長く）。爪を縁の前（後ろ）に落とし込んでから締める
    - id: cover
      label: 上面カバー
      file: cover.stl
      qty: 1
      color: '#5c6b80'
      material: PLA / PETG（フックのひずみは約 0.9 %）
      orient: 上面を下（STL の向きのまま）
      holds:
        - 天板の上の部品全体を覆う（高さ 62.4 mm、上面は Pi 3 段の上端から 6 mm 上）。LiDAR はカバーの上に出て、周りを測るのをじゃましない
        - 右側面の充電口（72 × 33 mm）から、カバーを付けたままバッテリーの USB-C に差せる
        - 右前にカメラの切り欠き（上面から前面まで）、後ろ左の角に液晶の窓、Pi の上に六角の通気口、上面に「AI-CAR」の文字
        - LiDAR の右隣に、上のバッテリーの残量表示の窓（17 × 16 mm。ほぼ真上から見る）
        - 手で触る縁（外側の角と稜線、壁の下端、充電口のふち）は 1 mm の面取り
      mount: 工具不要。真上から押し下げると左右 4 個のフックが外へたわみ、天板の端の裏に掛かる。外すときは左右の指かけを外へ引いて持ち上げる
  assembly_views:
    - label: 組み立て図
      note: 天板（154 × 200 × 2 mm）の上に、カバー以外の 4 種類・5 個の部品を組み立てた位置で表示（バッテリー・Pi・センサーなどの購入品は表示しない）
      plate: {size: [154, 200, 3], color: '#8fa3b8'}
      items:
        - {part: box}
        - {part: lid, translate: [0, 0, 36.4]}
        - {part: pi_base}
        - {part: bumper, flip_z: true, translate: [0, 0, 7]}
        - {part: bumper, flip_z: true, rotate_z: 180, translate: [154, 200, 7]}
    - label: 組み立て図（カバー付き）
      note: 上の組み立て図に上面カバーを付けた状態
      plate: {size: [154, 200, 3], color: '#8fa3b8'}
      items:
        - {part: box}
        - {part: lid, translate: [0, 0, 36.4]}
        - {part: pi_base}
        - {part: bumper, flip_z: true, translate: [0, 0, 7]}
        - {part: bumper, flip_z: true, rotate_z: 180, translate: [154, 200, 7]}
        - {part: cover, flip_z: true, translate: [0, 0, 62.4]}
  settings:
    - {name: 材料, value: 全部品 PLA で印刷できる（バンパーの板ばねのひずみ約 1.1 %、カバーのフック約 0.9 %。どちらも PLA の降伏ひずみ約 2 % の半分ほど）。PLA は 55〜60 ℃ で柔らかくなるので、夏の車内など熱いところに置かない。カバーを付けて長く動かすときは、Pi の上のラズパイ台とカバーが熱で変形しないか確かめる}
    - {name: ノズル / 積層ピッチ, value: 0.4 mm / 0.2 mm（目安）}
    - {name: 壁, value: 3 周以上（ねじ込み穴のまわりを厚くするため）。板ばね 0.8 mm は壁 2 周だけでできる}
    - {name: 充填, value: 20〜30 %（目安）}
    - {name: サポート, value: 不要（全部品、STL の向きのまま印刷）。カバーは上面を下にして印刷するので、窓の上辺（Z 方向の穴の天井）は 24 mm 以下のブリッジになる}
    - {name: プリンター, value: Creality K1C（印刷範囲 220 × 220 × 250 mm）で全部品を一体で印刷できる。いちばん大きいのはカバー（約 164 × 212 × 69 mm）}
    - {name: ブリム, value: 任意。箱（148 × 92 mm）は反りやすいので、反るときは付ける}
  screws:
    - {place: 天板への取付（箱のフランジ、ラズパイ台の腕、バンパーの腕）, screw: 天板の今のネジ（長いものに交換）, hole: Ø4.4 の通し穴}
    - {place: ふた → 箱のボス（4 か所）, screw: M3 × 12 mm, hole: 'ふた: Ø3.4 の通し穴 / 箱: M3 のねじ込み穴 深さ 12 mm'}
    - {place: LiDAR → ふたの柱（4 か所）, screw: M2.5 × 8 mm, hole: 下から座ぐり Ø5.2、上端 4 mm に Ø2.9 の通し穴}
    - {place: カメラ → ふたの前端の板のボス（4 か所）, screw: M2 × 6 mm, hole: M2 のねじ込み穴 深さ 6 mm}
    - {place: Pi 5 → ラズパイ台のボス（4 か所）, screw: M2.5（ネジかスペーサーのオス側）, hole: M2.5 のねじ込み穴 深さ 8 mm}
    - {place: DROK → 箱の後ろの壁, screw: 結束バンド 1 本（幅 3.6 mm まで）, hole: 取付穴がないため、受けの溝に立てて締める}
    - {place: 上面カバー → 天板, screw: ネジなし（左右 4 個のフック）, hole: 天板の左右の端の裏に、フックの爪（奥行き 2.3 mm）が掛かる}
  screw_note: ねじ込み穴は下穴（M2 Ø1.7 / M2.5 Ø2.1 / M3 Ø2.5）。普通の小ネジをねじ込むと、ネジ自身が樹脂にねじ山を切る。きつい・ゆるいときは SCAD の tap_d を 0.1 mm ずつ変える。screw_mode="insert" で熱圧入インサート用の穴にも切り替えられる
  assembly:
    - 天板の前側 4 本のネジを外し、フランジの厚さ（3 mm）ぶん長いネジで箱ごと留め直す
    - バッテリーを、ポートのある短辺を右の開口に向けて 2 個重ねて差し込み、左右のスロットに面ファスナーか結束バンドを通して固定する
    - LiDAR をふたの柱に載せ、ふたの裏から M2.5 × 8 mm のネジ 4 本で留める（ふたを箱に付ける前に行う）
    - DROK を部品面を Pi 側に向けて箱の後ろの棚に立て、中央のリブの穴に結束バンドを通して締める（ふたを付ける前のほうが通しやすい）
    - ふたを M3 × 12 mm のネジ 4 本で箱のボスに留める
    - カメラを正立（フラットケーブルが下）で M2 × 6 mm のネジ 4 本でふたの前端の板に留め、ケーブル（300 mm）を基板の下から後ろへ水平に折り、板の下の窓とふたの上のブリッジの下に通して Pi へ（途中で 45° に 2 回折って左へずらし、バッテリーの残量表示の窓をふさがない）
    - ラズパイ台を天板の後ろ側 4 穴に長いネジで留め、Pi 5 を M2.5 のネジかスペーサーで留める。IMU（ピン下向き、ジャンパー線を差してから台に載せる）と液晶を取り付ける
    - VL53L1X をバンパーの受けに入れ、バンパーを前後に重ねて共締めする
    - 上面カバーを、充電口が右（バッテリーのポート側）に来る向きで真上から被せ、左右のフックがカチッと天板の端の裏に掛かるまで押し下げる。外すときは左右の指かけを外へ引きながら持ち上げる
  gallery:
    - {file: assembly.png, label: 組み立てイメージ}
    - {file: cover_assembly.png, label: 上面カバーを付けた状態}
    - {file: cover_right.png, label: カバーの充電口（右側面）}
    - {file: cover_rear.png, label: カバーの液晶の窓と通気口（後ろ斜め）}
    - {file: cover_hook.png, label: カバーのフック（天板の端の裏に掛かる）}
    - {file: battery_display.png, label: バッテリーの残量表示の窓（右後ろ上から）}
    - {file: camera_mount.png, label: カメラの取付（前から）}
    - {file: camera_ribbon.png, label: カメラのケーブル（下から後ろへ水平に）}
    - {file: side.png, label: 横から（高さの関係）}
    - {file: top.png, label: 真上から}
    - {file: sensors.png, label: IMU と液晶の取付}
    - {file: drok_holder.png, label: DROK の受け（Pi 側から）}
    - {file: bumper_under.png, label: バンパーを下から}
    - {file: bumper_spring.png, label: バンパーの板ばねとストッパー}
    - {file: bumper_hook.png, label: バンパーの爪（横から見た断面）}
    - {file: tof_view.png, label: 落下防止センサーの視野（横から、45°）}
    - {file: screw_holes.png, label: ネジ穴の断面}
    - {file: wiring.png, label: 配線経路（後ろ斜め）}
    - {file: wiring_front.png, label: 配線経路（前斜め）}
    - {file: wiring_top.png, label: 配線経路（真上）}
  unverified:
    - 寸法はデータシート・商品画像からの読み取りで、実物に合わせていない（VL53L1X・IMU・液晶のピン位置、LiDAR の USB 変換基板の大きさ、DROK の部品の高さ）
    - LiDAR 底面のねじ穴の深さと、ねじ込み穴（下穴）のきつさ
    - バンパーの板ばねの硬さ（PLA・0.8 mm で計算上 約 8 N、ひずみ 約 1.1 %）
    - 車体や車輪にバンパーの壁が当たらないか、床からセンサーまでの高さ
    - バッテリーの残量表示の位置（ポートの短辺から 7〜20 mm は実測、右の長辺から 9〜21 mm のうち 21 mm は写真からの推定）と、カメラのケーブル（300 mm）の長さの余裕（約 2 cm）
    - LiDAR を左へ 8 mm ずらしたので、TF（base_link → laser）の横オフセットも直す必要がある
    - カバー: バッテリーの USB-C の口の位置（右側面の充電口は、箱の右の開口に合わせて広めに開けた）、天板の端の裏のすき間（板の厚さは実測の 2 mm で爪を掛ける）、フックの固さ、カバーを付けたときの Pi 5 と AI HAT+ の温度

nodes:
  - id: dashboard_node
    label: dashboard_node
    file: ai_car_web/dashboard_node.py
    role: FastAPI サーバー（別スレッド）+ rclpy ノード。ブラウザと ROS 2 の橋渡し。Web 操作とゲームパッドの指令を同じ経路で /cmd_vel_manual に変換する
    publishes: [/cmd_vel_manual, /drive_mode_request]
    subscribes: [/scan, /imu/data, /odom, /system_status, /camera/image_raw/compressed, /obstacle_status, /joy_cmd, /drive_mode, /autonomy_status]
    params:
      - {name: max_linear_speed, ref: dashboard_node.max_linear_speed, unit: m/s, desc: 正規化指令 1.0 のときの並進速度}
      - {name: max_angular_speed, ref: dashboard_node.max_angular_speed, unit: rad/s, desc: 正規化指令 1.0 のときの旋回速度}
      - {name: cmd_timeout, ref: dashboard_node.cmd_timeout, unit: s, desc: 無指令でゼロ速度を送るまでの時間}
      - {name: api_token, ref: dashboard_node.api_token, unit: '', desc: POST API のトークン（空なら認証なし）, secret: true}
    layer: ui
  - id: joy_teleop_node
    label: joy_teleop_node
    file: ai_car_web/joy_teleop_node.py
    role: Logitech F710 を Linux joystick API で読み、正規化 Twist を 10 Hz で publish。START 長押しで手動 ⇄ 自動、BACK で停止要求
    publishes: [/joy_cmd, /drive_mode_request]
    subscribes: [/drive_mode]
    params:
      - {name: speed_scale, ref: joy_teleop_node.speed_scale, unit: '', desc: 通常時の出力割合（RB で全速）}
      - {name: mode_hold_sec, ref: joy_teleop_node.mode_hold_sec, unit: s, desc: START 長押し時間}
    layer: ui
  - id: drive_mode_node
    label: drive_mode_node
    file: ai_car_web/drive_mode_node.py
    role: 手動 / 自動 / 停止のマルチプレクサ。/cmd_vel を publish する唯一のノード。各 watchdog と障害物最終ガードを持つ
    publishes: [/cmd_vel, /drive_mode]
    subscribes: [/cmd_vel_manual, /cmd_vel_auto, /drive_mode_request, /obstacle_status, /joy_cmd, /cliff_status]
    params:
      - {name: manual_timeout, ref: drive_mode_node.manual_timeout, unit: s, desc: MANUAL 中に手動指令が途絶えたら STOP}
      - {name: auto_timeout, ref: drive_mode_node.auto_timeout, unit: s, desc: AUTO 中に自動指令が途絶えたら STOP}
      - {name: obstacle_timeout, ref: drive_mode_node.obstacle_timeout, unit: s, desc: 障害物判定が古ければ LiDAR 停止とみなす}
      - {name: joy_timeout, ref: drive_mode_node.joy_timeout, unit: s, desc: ゲームパッド未接続判定}
      - {name: auto_requires_joy, ref: drive_mode_node.auto_requires_joy, unit: '', desc: AUTO にゲームパッド接続を必須にする}
      - {name: manual_override, ref: drive_mode_node.manual_override, unit: '', desc: AUTO 中の手動指令で MANUAL へ復帰}
      - {name: obstacle_guard, ref: drive_mode_node.obstacle_guard, unit: '', desc: stop 判定中は前進を 0 にする}
      - {name: cliff_guard, ref: drive_mode_node.cliff_guard, unit: '', desc: 前の段差で前進、後ろの段差で後退を 0 にする}
      - {name: cliff_timeout, ref: drive_mode_node.cliff_timeout, unit: s, desc: 落下防止センサーの判定がこれより古ければ受信なし}
      - {name: cliff_required, ref: drive_mode_node.cliff_required, unit: '', desc: 受信なし・センサー異常の側も段差ありとみなす}
    layer: control
  - id: autonomy_node
    label: autonomy_node
    file: ai_car_web/autonomy_node.py
    role: Level 1 自律走行。/scan を前 / 左 / 右 / 後セクターに分け、前進 → 減速 → 旋回 → 後退を決定して /cmd_vel_auto に 10 Hz で常時 publish（AUTO 以外はゼロ）
    publishes: [/cmd_vel_auto, /autonomy_status]
    subscribes: [/scan, /obstacle_status, /drive_mode]
    params:
      - {name: cruise_speed, ref: autonomy_node.cruise_speed, unit: m/s, desc: 前進速度}
      - {name: slow_speed, ref: autonomy_node.slow_speed, unit: m/s, desc: 減速時の速度}
      - {name: turn_speed, ref: autonomy_node.turn_speed, unit: rad/s, desc: その場旋回の角速度}
      - {name: backoff_speed, ref: autonomy_node.backoff_speed, unit: m/s, desc: 後退速度}
      - {name: slow_distance, ref: autonomy_node.slow_distance, unit: m, desc: この距離以内で減速}
      - {name: stop_distance, ref: autonomy_node.stop_distance, unit: m, desc: この距離以内で旋回}
      - {name: clear_distance, ref: autonomy_node.clear_distance, unit: m, desc: 前方がこの距離以上空くまで旋回を続ける}
      - {name: backoff_distance, ref: autonomy_node.backoff_distance, unit: m, desc: 前後左右すべてこの距離以内なら後退}
      - {name: min_turn_sec, ref: autonomy_node.min_turn_sec, unit: s, desc: 旋回の最短継続時間}
      - {name: scan_max_age, ref: autonomy_node.scan_max_age, unit: s, desc: LiDAR がこれより古いと停止}
    layer: control
  - id: perception_node
    label: perception_node
    file: ai_car_web/perception_node.py
    role: 前方 ±30° を左 / 中央 / 右で評価し 停止 / 減速 / 安全 / 不明 を判定。カメラ画像を AI HAT+（YOLOv8m）で推論し、LiDAR の同方位距離を物体に付与。温度で推論レートを制御し、複数フレームで検出を確認
    publishes: [/obstacle_status]
    subscribes: [/scan, /camera/image_raw/compressed, /system_status]
    params:
      - {name: stop_distance, ref: perception_node.stop_distance, unit: m, desc: 停止判定}
      - {name: slow_distance, ref: perception_node.slow_distance, unit: m, desc: 減速判定}
      - {name: danger_distance, ref: perception_node.danger_distance, unit: m, desc: 検出枠を赤にする距離}
      - {name: inference_rate, ref: perception_node.inference_rate, unit: Hz, desc: 推論レート上限}
      - {name: score_threshold, ref: perception_node.score_threshold, unit: '', desc: 検出信頼度の下限}
      - {name: detect_confirm_frames, ref: perception_node.detect_confirm_frames, unit: frame, desc: 検出を確定するフレーム数}
      - {name: detect_history_frames, ref: perception_node.detect_history_frames, unit: frame, desc: 検出確認に使う履歴長}
      - {name: model_gops, ref: perception_node.model_gops, unit: GOP, desc: YOLOv8m 640x640 の演算量}
      - {name: cpu_temp_warn, ref: perception_node.cpu_temp_warn, unit: ℃, desc: 推論 40% へ}
      - {name: cpu_temp_crit, ref: perception_node.cpu_temp_crit, unit: ℃, desc: 推論停止（LiDAR 判定は継続）}
      - {name: hailo_temp_warn, ref: perception_node.hailo_temp_warn, unit: ℃, desc: 推論 40% へ}
      - {name: hailo_temp_crit, ref: perception_node.hailo_temp_crit, unit: ℃, desc: 推論停止}
    layer: perception
  - id: rplidar
    label: rplidar（rplidar_ros）
    file: 外部パッケージ ros-jazzy-rplidar-ros
    role: RPLIDAR A1M8 を読み /scan を約 8 Hz で publish（launch 側で respawn）
    publishes: [/scan]
    subscribes: []
    params: []
    layer: sensor
  - id: camera
    label: camera（camera_ros）
    file: 外部パッケージ camera_ros + Raspberry Pi 版 libcamera
    role: IMX708 を 960×540 30fps で取り込み JPEG（品質 80）で publish（launch 側で respawn）
    publishes: [/camera/image_raw/compressed]
    subscribes: []
    params: []
    layer: sensor
  - id: imu_node
    label: imu_node
    file: ai_car_web/imu_node.py
    role: GY-BNO055（I2C 0x29）を読み /imu/data を 20 Hz で publish
    publishes: [/imu/data]
    subscribes: []
    params: []
    layer: sensor
  - id: cliff_sensor_node
    label: cliff_sensor_node
    file: ai_car_web/cliff_sensor_node.py
    role: 前後バンパーの VL53L1X ×2 を XSHUT で 1 個ずつ起こしてアドレスを 0x2A / 0x2B に変え、約 40 回/秒で床までの距離を読む。距離がしきい値を超えるか反射が返らない状態が続いたら段差として /cliff_status に publish
    publishes: [/cliff_status]
    subscribes: []
    params:
      - {name: cliff_distance_mm, ref: cliff_sensor_node.cliff_distance_mm, unit: mm, desc: この距離を超えたら段差（平らな床は約 95 mm）}
      - {name: cliff_confirm, ref: cliff_sensor_node.cliff_confirm, unit: 回, desc: 段差と判定するまでの連続回数}
      - {name: clear_confirm, ref: cliff_sensor_node.clear_confirm, unit: 回, desc: 解除するまでの連続回数}
      - {name: timing_budget_ms, ref: cliff_sensor_node.timing_budget_ms, unit: ms, desc: 1 回の測定時間（短距離モード）}
      - {name: intermeasurement_ms, ref: cliff_sensor_node.intermeasurement_ms, unit: ms, desc: 測定の間隔}
    layer: sensor
  - id: system_monitor_node
    label: system_monitor_node
    file: ai_car_web/system_monitor_node.py
    role: CPU / メモリ / PMIC 電圧・電流 / スロットリング / Hailo-8 温度を 1 Hz で /system_status に publish（読み取りのみ）
    publishes: [/system_status]
    subscribes: []
    params: []
    layer: sensor
  - id: lcd_display_node
    label: lcd_display_node
    file: ai_car_web/lcd_display_node.py
    role: ST7789 液晶に状態（待機 / 手動 / 自動 / 停止 / 障害物停止 / 減速 / 低電圧）と運転モード・前方距離・電圧・CPU 温度・IP を描画。従来の 4 文字コードを /display_state に publish
    publishes: [/display_state]
    subscribes: [/system_status, /obstacle_status, /joy_cmd, /cmd_vel, /drive_mode, /autonomy_status]
    params:
      - {name: rotation, ref: lcd_display_node.rotation, unit: 度, desc: 画面の向き（反時計回り）}
    layer: ui
  - id: motor_control_node
    label: motor_control_node（未実装）
    file: ''
    role: /cmd_vel を購読しメカナム逆運動学で M1〜M4 を駆動する予定（motor_hat.yaml の割り付けを参照）
    publishes: []
    subscribes: [/cmd_vel]
    params: []
    layer: actuator
    planned: true

topics:
  - {name: /scan, type: sensor_msgs/LaserScan, desc: LiDAR 360° スキャン（約 8 Hz）}
  - {name: /camera/image_raw/compressed, type: sensor_msgs/CompressedImage, desc: カメラ JPEG（30 Hz）}
  - {name: /imu/data, type: sensor_msgs/Imu, desc: 姿勢・角速度・加速度（20 Hz）}
  - {name: /system_status, type: std_msgs/String (JSON), desc: Pi / AI HAT+ の状態（1 Hz）}
  - {name: /obstacle_status, type: std_msgs/String (JSON), desc: 障害物判定 level / 距離 / 検出物体（5 Hz）}
  - {name: /cliff_status, type: std_msgs/String (JSON), desc: 前後の落下防止センサーの距離・段差判定（10 Hz ＋ 変化時）}
  - {name: /joy_cmd, type: geometry_msgs/Twist, desc: ゲームパッドの正規化指令（10 Hz）}
  - {name: /cmd_vel_manual, type: geometry_msgs/Twist, desc: Web + ゲームパッドの手動速度指令}
  - {name: /cmd_vel_auto, type: geometry_msgs/Twist, desc: 自律走行の速度指令（10 Hz、AUTO 以外はゼロ）}
  - {name: /drive_mode_request, type: std_msgs/String (JSON), desc: 'モード切替要求 {mode: manual|auto|stop|toggle, source}'}
  - {name: /drive_mode, type: std_msgs/String (JSON), desc: 現在の運転モードと拒否理由（5 Hz・transient local）}
  - {name: /cmd_vel, type: geometry_msgs/Twist, desc: 最終速度指令（drive_mode_node のみが publish）}
  - {name: /autonomy_status, type: std_msgs/String (JSON), desc: 自律行動・セクター距離・自動指令}
  - {name: /display_state, type: std_msgs/String, desc: 表示器の 4 文字状態コード}
  - {name: /odom, type: nav_msgs/Odometry, desc: オドメトリ（未実装、現在は publisher なし）}

drive_modes:
  states:
    - {id: manual, label: 手動, desc: /cmd_vel_manual（Web + ゲームパッド）を /cmd_vel へ中継。起動時の既定}
    - {id: auto, label: 自動, desc: /cmd_vel_auto（autonomy_node）を 10 Hz で中継}
    - {id: stop, label: 停止, desc: ゼロ速度を定期的に publish。手動指令は無視し、明示的に「手動」へ戻す必要がある}
  transitions:
    - {from: manual, to: auto, trigger: Web「自動」/ START 長押し, condition: 進入条件をすべて満たす（下記）}
    - {from: auto, to: manual, trigger: 手動指令（スティック / Web）を検出, condition: manual_override}
    - {from: auto, to: stop, trigger: 自動指令が auto_timeout 途絶 / ゲームパッド切断 / LiDAR 判定途絶, condition: watchdog / guard}
    - {from: manual, to: stop, trigger: 手動指令が manual_timeout 途絶（移動中）, condition: watchdog}
    - {from: any, to: stop, trigger: Web「停止」・赤い停止ボタン（/api/stop）/ BACK / 自動中の B, condition: 常に}
    - {from: stop, to: manual, trigger: Web「手動」/ START 長押し, condition: 常に}
    - {from: stop, to: auto, trigger: Web「自動」/ START 長押し, condition: 進入条件をすべて満たす}
  auto_entry_conditions:
    - /obstacle_status が新鮮（obstacle_timeout 以内）で level が stop / unknown でない
    - ゲームパッドが接続中（auto_requires_joy）
    - スティック・手動操作がニュートラル
    - /cmd_vel_auto が生きている（autonomy_node 起動中）
    - 落下防止センサーが前後とも段差を示していない（cliff_required なら受信中であることも必要）
  safety:
    - {name: Web 指令タイムアウト, where: dashboard_node, ref: dashboard_node.cmd_timeout, unit: s, desc: 無指令でゼロ速度}
    - {name: 手動 watchdog, where: drive_mode_node, ref: drive_mode_node.manual_timeout, unit: s, desc: MANUAL 中の手動指令途絶で STOP}
    - {name: 自動 watchdog, where: drive_mode_node, ref: drive_mode_node.auto_timeout, unit: s, desc: AUTO 中の自動指令途絶で STOP}
    - {name: LiDAR 途絶, where: drive_mode_node, ref: drive_mode_node.obstacle_timeout, unit: s, desc: 障害物判定が古ければ AUTO を拒否 / STOP}
    - {name: ゲームパッド切断, where: drive_mode_node, ref: drive_mode_node.joy_timeout, unit: s, desc: AUTO 中の切断で STOP}
    - {name: 障害物最終ガード, where: drive_mode_node / dashboard_node, ref: '', unit: '', desc: stop 判定中はどのモードでも前進を 0 にする。slow 判定では speed_scale で減速}
    - {name: 落下防止ガード, where: drive_mode_node, ref: drive_mode_node.cliff_guard, unit: '', desc: 前の段差で前進、後ろの段差で後退を 0 にする。AUTO 中に段差を検出したら STOP。横移動・旋回は止めない（前後のセンサーは横を見ていない）}
    - {name: モード遷移時のゼロ速度, where: drive_mode_node, ref: '', unit: '', desc: 遷移時と起動時に必ず一度ゼロ速度を publish}
    - {name: サーマル制御, where: perception_node, ref: '', unit: '', desc: CPU 70℃ / Hailo 75℃ で推論 40%、78℃ / 85℃ で推論停止（LiDAR 判定は継続）}
    - {name: API トークン認証, where: dashboard_node, ref: '', unit: '', desc: api_token 設定時は POST API に X-API-Token / Bearer が必須}

autonomy:
  sectors:
    - {id: front, label: 前, angle: ±30°（front_angle_deg 60°）, use: 減速 / 旋回 / 後退判定}
    - {id: front_left, label: 前左, angle: 前セクターの左半分 0°〜30°, use: 旋回方向の選択}
    - {id: front_right, label: 前右, angle: 前セクターの右半分 0°〜-30°, use: 旋回方向の選択}
    - {id: left, label: 左, angle: 30°〜150°, use: 旋回方向 / 後退判定}
    - {id: right, label: 右, angle: -30°〜-150°, use: 旋回方向 / 後退判定}
    - {id: back, label: 後, angle: 180°±30°, use: 後退の安全確認（測距なしなら後退しない）}
  behaviors:
    - {id: forward, label: 前進, condition: 前方 > slow_distance, output: linear.x = cruise_speed}
    - {id: slow, label: 減速, condition: stop_distance < 前方 ≤ slow_distance, output: linear.x = slow_speed、近い側から離れる方向へ緩く旋回}
    - {id: turn, label: 旋回, condition: 前方 ≤ stop_distance, output: 空いている側へ angular.z = ±turn_speed。前方が clear_distance 以上空くまで（最短 min_turn_sec）}
    - {id: backoff, label: 後退, condition: 前・左・右 ≤ backoff_distance かつ 後方に測距があり > stop_distance, output: linear.x = −backoff_speed}
    - {id: blocked, label: 待機（LiDAR なし）, condition: /scan が scan_max_age より古い, output: ゼロ速度}
  perception_flow:
    - LiDAR /scan → 取り付け向き補正（scan_angle_offset_deg 180°）→ 前方 ±30° を左 / 中央 / 右で最短距離 → stop / slow / clear / unknown
    - カメラ JPEG → 640×640 にレターボックス → Hailo-8 YOLOv8m（78.9 GOP）→ 元画像座標へ検出枠を復元 → camera_hfov_deg で方位角へ → LiDAR の点をカメラの位置（camera_offset_x_m / _y_m、前 53 mm・右 44 mm）から見た方位に直し、同方位クラスタ（cluster_gap）の中央値を距離として付与
    - /obstacle_status → drive_mode_node（最終ガード・AUTO 進入条件）、autonomy_node、dashboard_node（減速 speed_scale）、液晶表示

api:
  rest:
    - {method: GET, path: /, desc: ダッシュボード HTML, auth: false}
    - {method: GET, path: /api/status, desc: テレメトリ一式（cmd_vel / scan / imu / system / obstacle / camera / drive_mode / autonomy / joy）, auth: false}
    - {method: GET, path: /api/gpio, desc: 40 ピンヘッダーの配線表, auth: false}
    - {method: GET, path: /api/motor_hat, desc: Motor HAT M1〜M4 割り付けとエンコーダーピン, auth: false}
    - {method: GET, path: /api/architecture, desc: この説明画面の構成定義（実機の生存トピック付き）, auth: false}
    - {method: GET, path: /api/drive_mode, desc: 現在の運転モード, auth: false}
    - {method: GET, path: '/print3d/{file}', desc: 3D プリント部品の STL・図・OpenSCAD ソース（hardware/3d/battery_lidar_mount）, auth: false}
    - {method: POST, path: /api/cmd_vel, desc: '手動速度指令 {linear_x, linear_y, angular_z} (−1〜1)', auth: true}
    - {method: POST, path: /api/stop, desc: 全モード停止（ゼロ速度 + stop モード要求）, auth: true}
    - {method: POST, path: /api/drive_mode, desc: 'モード切替 {mode: manual|auto|stop}', auth: true}
    - {method: GET, path: /api/camera/snapshot, desc: JPEG 1 枚, auth: false}
    - {method: GET, path: /api/camera/stream, desc: MJPEG ストリーム, auth: false}
    - {method: WS, path: /ws, desc: テレメトリ配信（telemetry_rate Hz）。未導入環境は /api/status ポーリングにフォールバック, auth: false}
  auth_note: dashboard_node.api_token または環境変数 AI_CAR_API_TOKEN を設定すると auth=true の API に X-API-Token（または Authorization Bearer）ヘッダーが必要。UI は ?token= を一度開くと localStorage に保存する

status:
  known_issues:
    - 実機の電源不足（Undervoltage 検出）。公式 27W PD 電源と LiDAR の別系統給電が必要
    - /odom 未実装のためオドメトリは null
    - motor_hat.yaml / gpio_pins.yaml のモーター・エンコーダー配線は暫定値。実配線と照合が必要
    - IMU の搭載向きが imu_link と一致しておらず軸補正が必要
    - カメラと LiDAR の外部キャリブレーション未実施（同軸・同方向前提）
    - 落下防止センサー（VL53L1X）は配線・プログラムのみで、実機では未確認。モーター制御ノードが未実装のため、段差で /cmd_vel を止めても実際のモーターはまだ止まらない
  next:
    - モーター制御ノード（/cmd_vel → Motor HAT）の実装
    - 実配線に合わせた motor_hat.yaml / gpio_pins.yaml の修正
    - エンコーダー読み取りノード → /odom
    - 実機で自動モードの旋回方向・速度・しきい値を調整
  docs:
    - {name: README.md, desc: セットアップ・実行・各デバイスの導入手順}
    - {name: PROJECT_STATUS.md, desc: 実装済み機能・既知の問題・テスト結果・次回作業}
    - {name: PROJECT_RULES.md, desc: 開発ルール}
    - {name: HARDWARE_BOM.md, desc: 部品構成表・電源系統}
    - {name: hardware/3d/battery_lidar_mount/README.md, desc: 3D プリント部品の寸法・ネジ穴・配線経路・組み立て}
    - {name: CHANGELOG.md, desc: 変更履歴}
