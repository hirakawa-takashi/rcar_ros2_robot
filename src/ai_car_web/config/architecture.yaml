  unverified:
    - 寸法はデータシート・商品画像からの読み取りで、実物に合わせていない（VL53L1X・IMU のピン位置、LiDAR の USB 変換基板の大きさ、DROK の部品の高さ、Camera Module 3 Wide のレンズの長さ・裏の端子の厚さ）
    - LiDAR 底面のねじ穴の深さと、ねじ込み穴（下穴）のきつさ
    - バンパーの板ばねの硬さ（PLA・0.8 mm で計算上 約 8 N、ひずみ 約 1.1 %）
    - 車体や車輪にバンパーの壁が当たらないか、床からセンサーまでの高さ
    - バッテリーの残量表示の位置（ポートの短辺から 7〜20 mm は実測、右の長辺から 9〜21 mm のうち 21 mm は写真からの推定）
    - モーター取付ネジの頭が、図面の 28 × 28 mm の範囲に収まり、高さ 3 mm 以下か（くぼみは 29 × 29 × 3.5 mm）
    - カバー：バッテリーの USB-C の口の位置（右側面の充電口は、箱の右の開口に合わせて広めに開けた）、天板の端の裏のすき間（板の厚さは実測の 2 mm で爪を掛ける）、フックの固さ、カバーを付けたときの Pi 5 と AI HAT+ の温度、カバーの左の穴から Pi 5 の電源ボタンが押せるか（ボタンの位置は図面に寸法がなく、広めに見込んだ）、右の USB / LAN にストレートのプラグを差してカバーが付くか

nodes:
  - id: dashboard_node
    label: dashboard_node
    file: ai_car_web/dashboard_node.py
    role: FastAPI サーバー（別スレッド）+ rclpy ノード。ブラウザと ROS 2 の橋渡し。Web 操作とゲームパッドの指令を同じ経路で /cmd_vel_manual に変換する
    publishes: [/cmd_vel_manual, /drive_mode_request, /jetson_detections]
    subscribes: [/scan, /imu/data, /imu/mag, /imu/mag_status, /odom, /system_status, /camera/image_raw/compressed, /obstacle_status, /joy_cmd, /drive_mode, /autonomy_status, /cliff_status, /map, /pose]
    params:
      - {name: max_linear_speed, ref: dashboard_node.max_linear_speed, unit: m/s, desc: 正規化指令 1.0 のときの並進速度}
      - {name: max_angular_speed, ref: dashboard_node.max_angular_speed, unit: rad/s, desc: 正規化指令 1.0 のときの旋回速度}
      - {name: cmd_timeout, ref: dashboard_node.cmd_timeout, unit: s, desc: 無指令でゼロ速度を送るまでの時間}
      - {name: output_percent, ref: dashboard_node.output_percent, unit: '%', desc: 「出力」の初期値。手動・ゲームパッド・自動の最大の速さ = max_* × 出力}
      - {name: api_token, ref: dashboard_node.api_token, unit: '', desc: POST API のトークン（空なら認証なし）, secret: true}
    layer: ui
  - id: joy_teleop_node
    label: joy_teleop_node
    file: ai_car_web/joy_teleop_node.py
    role: Logitech F710 を Linux joystick API で読み、正規化 Twist を 10 Hz で publish。START 長押しで手動 ⇄ 自動、BACK で停止要求
    publishes: [/joy_cmd, /drive_mode_request]
    subscribes: [/drive_mode]
    params:
      - {name: speed_scale, ref: joy_teleop_node.speed_scale, unit: '', desc: スティックを倒しきったときの割合（1.0 = ダッシュボードの「出力」）}
      - {name: mode_hold_sec, ref: joy_teleop_node.mode_hold_sec, unit: s, desc: START 長押し時間}
    layer: ui
  - id: drive_mode_node
    label: drive_mode_node
    file: ai_car_web/drive_mode_node.py
    role: 手動 / 自動 / 停止のマルチプレクサ。/cmd_vel を publish する唯一のノード。各 watchdog と障害物・段差の最終ガードを持つ
    publishes: [/cmd_vel, /drive_mode]
    subscribes: [/cmd_vel_manual, /cmd_vel_auto, /drive_mode_request, /obstacle_status, /joy_cmd, /cliff_status]
    params:
      - {name: manual_timeout, ref: drive_mode_node.manual_timeout, unit: s, desc: MANUAL 中に手動指令が途絶えたら STOP}
      - {name: auto_timeout, ref: drive_mode_node.auto_timeout, unit: s, desc: AUTO 中に自動指令が途絶えたら STOP}
      - {name: obstacle_timeout, ref: drive_mode_node.obstacle_timeout, unit: s, desc: 障害物判定が古ければ LiDAR 停止とみなす}
      - {name: joy_timeout, ref: drive_mode_node.joy_timeout, unit: s, desc: ゲームパッド未接続判定}
      - {name: auto_requires_joy, ref: drive_mode_node.auto_requires_joy, unit: '', desc: AUTO にゲームパッド接続を必須にする}
      - {name: manual_override, ref: drive_mode_node.manual_override, unit: '', desc: AUTO 中の手動指令で MANUAL へ復帰}
      - {name: default_output, ref: drive_mode_node.default_output, unit: '', desc: ダッシュボードの「出力」（/drive_output）が届くまでの上限の割合}
      - {name: obstacle_guard, ref: drive_mode_node.obstacle_guard, unit: '', desc: LiDAR 360°（perception_node の move）で、動く向きの車体の端から物まで move_stop_gap 以下ならその向きの動き、その向きに回ると箱に点が入る（turn_stop_deg 未満）ならその向きの回転を 0 にする。ななめが止まっても前後・横の空いている分は動く。手動は move_slow_gap 以下で半分の速さ。LiDAR データなし（unknown）・判定の途絶中は前後左右の動きを 0。止めた理由は /drive_mode の guard}
      - {name: cliff_guard, ref: drive_mode_node.cliff_guard, unit: '', desc: 段差を検出した向き（前 / 後）への移動を 0 にする（AUTO はそのまま。下がって回るのは autonomy_node）}
      - {name: cliff_timeout, ref: drive_mode_node.cliff_timeout, unit: s, desc: 段差判定が古ければ使わない（配線済みなら AUTO を拒否 / STOP）}
    layer: control
  - id: motor_driver_node
    label: motor_driver_node
    file: ai_car_web/motor_driver_node.py
    role: /cmd_vel をメカナムの逆運動学で 4 輪の出力にし、Motor HAT（PCA9685 + TB6612、I2C 0x60）の M1〜M4 を PWM で回す（エンコーダーなし）。割り付けと向きは motor_hat.yaml。/cmd_vel が途絶えたら止める。旋回の指令が 0 で動くあいだは IMU の向きを保つ旋回を足す（heading_hold）
    publishes: [/motor_status]
    subscribes: [/cmd_vel, /imu/data]
    params:
      - {name: max_linear_speed, ref: motor_driver_node.max_linear_speed, unit: m/s, desc: この速さの指令で出力 100 %}
      - {name: max_angular_speed, ref: motor_driver_node.max_angular_speed, unit: rad/s, desc: この旋回の指令で出力 100 %}
      - {name: max_duty, ref: motor_driver_node.max_duty, unit: '', desc: 出力 100 % のときの PWM（0〜1）}
      - {name: timeout, ref: motor_driver_node.timeout, unit: s, desc: /cmd_vel がこの秒数届かないと止める}
      - {name: heading_hold, ref: motor_driver_node.heading_hold, unit: '', desc: 旋回の指令が 0 で動くあいだ、IMU の向きを動き始めの向きに保つ}
      - {name: heading_kp, ref: motor_driver_node.heading_kp, unit: (rad/s)/rad, desc: 向きのずれに対する旋回の強さ}
      - {name: heading_max_correction, ref: motor_driver_node.heading_max_correction, unit: rad/s, desc: 向きを保つために足す旋回の上限}
      - {name: heading_deadband_deg, ref: motor_driver_node.heading_deadband_deg, unit: deg, desc: このずれまでは直さない}
    layer: control
  - id: encoder_odom_node
    label: encoder_odom_node
    file: ai_car_web/encoder_odom_node.py
    role: 4 輪のエンコーダー（A/B 相、ピンは motor_hat.yaml）を別プロセスで 4 逓倍に数え、メカナムの順運動学で /odom と odom → base_footprint の TF を 20 Hz で出す
    publishes: [/odom, /tf]
    subscribes: [/imu/data]
    params:
      - {name: counts_per_rev, ref: encoder_odom_node.counts_per_rev, unit: カウント, desc: 車輪 1 回転のカウント（床の 1.8 m で合わせた値、11 パルス × 4 × 32 相当）}
      - {name: wheel_radius, ref: encoder_odom_node.wheel_radius, unit: m, desc: 車輪の半径}
      - {name: wheel_base_half, ref: encoder_odom_node.wheel_base_half, unit: m, desc: 中心から車輪まで（前後）}
      - {name: track_half, ref: encoder_odom_node.track_half, unit: m, desc: 中心から車輪まで（左右）}
      - {name: yaw_scale, ref: encoder_odom_node.yaw_scale, unit: 倍, desc: 向きの変化にかける倍率（床の回転で合わせた値）}
      - {name: publish_tf, ref: encoder_odom_node.publish_tf, unit: '', desc: odom → base_footprint の TF も出す}
    layer: sensor
  - id: autonomy_node
    label: autonomy_node
    file: ai_car_web/autonomy_node.py
    role: 自律走行。行き先がないときは Level 1（/scan を前 / 左 / 右 / 後セクターに分け、前進 → 減速 → 旋回 → 後退。前の近さは車の幅の帯の中だけで見て、ドア・廊下では横にずれてまん中を通る。減速の帯で空いている側へ曲がりはじめ、動けないと下がる → 横 → 反対へ回るで抜け出す）。/nav_goal の plan は Nav2 の compute_path_to_pose で道だけ考え、go は navigate_to_pose で向かい、AUTO のあいだ /cmd_vel_nav を中継する（Level 2。着いた・行けない・やめたら止まって待つ。AUTO を抜けるとやめる）。/cmd_vel_auto に 10 Hz で常時 publish（AUTO 以外はゼロ）。前が段差なら /odom で cliff_backoff_m 下がって cliff_turn_deg 回る（行き先より先）
    publishes: [/cmd_vel_auto, /autonomy_status]
    subscribes: [/scan, /obstacle_status, /drive_mode, /cliff_status, /odom, /nav_goal, /cmd_vel_nav, /plan]
    params:
      - {name: cliff_backoff_m, ref: autonomy_node.cliff_backoff_m, unit: m, desc: 前が段差のとき /odom でこれだけ下がる}
      - {name: cliff_turn_deg, ref: autonomy_node.cliff_turn_deg, unit: °, desc: 下がったあと、空いている側へこれだけ回ってから走行を続ける}
      - {name: cliff_escape_timeout, ref: autonomy_node.cliff_escape_timeout, unit: s, desc: 下がる・回るのそれぞれの上限（前がまだ段差なら止まったまま）}
      - {name: cruise_speed, ref: autonomy_node.cruise_speed, unit: m/s, desc: 前進速度}
      - {name: slow_speed, ref: autonomy_node.slow_speed, unit: m/s, desc: 減速時の速度}
      - {name: turn_speed, ref: autonomy_node.turn_speed, unit: rad/s, desc: その場旋回の角速度}
      - {name: backoff_speed, ref: autonomy_node.backoff_speed, unit: m/s, desc: 後退速度}
      - {name: slow_distance, ref: autonomy_node.slow_distance, unit: m, desc: この距離以内で減速}
      - {name: stop_distance, ref: autonomy_node.stop_distance, unit: m, desc: この距離以内で旋回}
      - {name: clear_distance, ref: autonomy_node.clear_distance, unit: m, desc: 前方がこの距離以上空くまで旋回を続ける}
      - {name: backoff_distance, ref: autonomy_node.backoff_distance, unit: m, desc: 前後左右すべてこの距離以内なら後退}
      - {name: min_turn_sec, ref: autonomy_node.min_turn_sec, unit: s, desc: 旋回の最短継続時間}
      - {name: random_side_distance, ref: autonomy_node.random_side_distance, unit: m, desc: 左右の両方がこれより空いていれば、曲がる向きをランダムに選ぶ（同じ所をくるくる回らないため）}
      - {name: turn_random_sec, ref: autonomy_node.turn_random_sec, unit: s, desc: 旋回を 0〜この秒数だけランダムに長くして、向きを毎回少し変える}
      - {name: explore_step_deg, ref: autonomy_node.explore_step_deg, unit: deg, desc: 曲がる先の候補の向き。まわり 360° をこの角度ごとに調べる（細い出口は 10〜15° の幅でしか見えないので 5°）}
      - {name: explore_min_turn_deg, ref: autonomy_node.explore_min_turn_deg, unit: deg, desc: 今の前からこの角度以内の向きは曲がる先の候補にしない}
      - {name: explore_min_free, ref: autonomy_node.explore_min_free, unit: m, desc: 車の幅でこれ以上まっすぐ進める向きだけを曲がる先の候補にする}
      - {name: explore_cell, ref: autonomy_node.explore_cell, unit: m, desc: 行った所を覚えるマスの大きさ（/odom）。曲がる先の向きの、行ける所まで（進める距離 − stop_distance、最大 3 m）のマスに入った回数が少ない向きほど選ばれやすい（重み＝進める距離 × まだ行っていない度合いの 2 乗）。壁ぎわ・行き止まりのマスは数えない}
      - {name: explore_reach_deg, ref: autonomy_node.explore_reach_deg, unit: deg, desc: 曲がる先の向きまでこれより近くなったら回るのをやめる}
      - {name: explore_turn_timeout, ref: autonomy_node.explore_turn_timeout, unit: s, desc: 曲がる先の向きまで回るのは最大この秒数（すべったときなど）}
      - {name: explore_via, ref: autonomy_node.explore_via, unit: bool, desc: 細い通路の入口を探す。まっすぐ explore_min_free 進めない向きでも、入口の手前まで進んで、そこから曲がれば車の幅で進めるなら候補にする}
      - {name: explore_via_deg, ref: autonomy_node.explore_via_deg, unit: deg, desc: 入口の手前から、この角度（±）までの向きに曲がれるかを見る}
      - {name: explore_via_min_m, ref: autonomy_node.explore_via_min_m, unit: m, desc: 入口の手前までこれより短いときは、入口として見ない}
      - {name: explore_via_sec, ref: autonomy_node.explore_via_sec, unit: s, desc: 入口へ向いたあと、この秒数は向きを選びなおさずに入口の手前までまっすぐ進む}
      - {name: frontier_map_topic, ref: autonomy_node.frontier_map_topic, unit: topic, desc: まだ行っていない所のはし（SLAM の地図の空きと不明のさかい）を探す地図。空にすると無効}
      - {name: frontier_stale_sec, ref: autonomy_node.frontier_stale_sec, unit: s, desc: 新しいマス（explore_cell）にこの秒数入らなかったら、いちばん近い「はし」へ Nav2 で向かう}
      - {name: frontier_min_cells, ref: autonomy_node.frontier_min_cells, unit: cell, desc: 「はし」のかたまりがこのマス数（地図の 1 マス）より小さければ使わない}
      - {name: frontier_clear_m, ref: autonomy_node.frontier_clear_m, unit: m, desc: 壁からこれより近い「はし」は行き先にしない}
      - {name: frontier_min_dist, ref: autonomy_node.frontier_min_dist, unit: m, desc: 車からこれより近い「はし」は行き先にしない}
      - {name: frontier_timeout_sec, ref: autonomy_node.frontier_timeout_sec, unit: s, desc: この秒数で着かなければやめて、ふつうの走行にもどる。段差の印の cliff_avoid_m 以内に近づいてもやめる}
      - {name: frontier_retry_sec, ref: autonomy_node.frontier_retry_sec, unit: s, desc: 行けなかった「はし」の 0.6 m 以内は、この秒数えらばない。車の所から、壁から frontier_clear_m 以上はなれた空きだけを通って行ける所だけを選ぶ}
      - {name: frontier_visited_m, ref: autonomy_node.frontier_visited_m, unit: m, desc: 通ったマスからこれより遠い空き（LiDAR で見えていても車が行っていない所）も行き先にする}
      - {name: frontier_min_area_cells, ref: autonomy_node.frontier_min_area_cells, unit: cell, desc: 行っていない空きのかたまりがこのマス数より小さければ使わない}
      - {name: slow_hysteresis_m, ref: autonomy_node.slow_hysteresis_m, unit: m, desc: 減速から前進にもどるのは slow_distance + これより空いてから（減速と前進を何度も行き来しない）}
      - {name: slow_keep_sec, ref: autonomy_node.slow_keep_sec, unit: s, desc: 減速をやめてこの秒数以内にまた減速したら、前と同じ向きに曲がる}
      - {name: turn_max_deg, ref: autonomy_node.turn_max_deg, unit: deg, desc: その場でこの角度回っても出口がなければ stuck で止まる}
      - {name: path_half_width, ref: autonomy_node.path_half_width, unit: m, desc: 前の近さ（減速・旋回）を見る帯の半分の幅。帯の外の物（ドアの柱など）では減速・旋回しない}
      - {name: center_range, ref: autonomy_node.center_range, unit: m, desc: 左右の両方にこれより近い物があると、横へずれてまん中を通る}
      - {name: center_speed, ref: autonomy_node.center_speed, unit: m/s, desc: まん中へ寄る横の速さの上限}
      - {name: pre_turn_gain, ref: autonomy_node.pre_turn_gain, unit: '', desc: 減速の帯で、近づくほど空いている側へ曲がる強さ（止まる直前で turn_speed のこの倍）。止まってから回る前に向きを変えはじめる}
      - {name: stuck_sec, ref: autonomy_node.stuck_sec, unit: s, desc: 動く指令なのにこの秒数、LiDAR の距離も向きも変わらなければ「動けない」とみて、下がる → 横にずれる → 反対へ回る}
      - {name: unstick_max, ref: autonomy_node.unstick_max, unit: 回, desc: 抜け出しのあと unstick_window 秒のうちにまた動けないことが続き、この回数抜け出してもまた動けなければ止まる（AUTO に入り直すまで）}
      - {name: tilt_stop_deg, ref: autonomy_node.tilt_stop_deg, unit: °, desc: AUTO に入ったときより roll / pitch がこの角度以上かたむいたら止まる（落ちた・乗り上げた。AUTO に入り直すまで）}
      - {name: tilt_hold_sec, ref: autonomy_node.tilt_hold_sec, unit: s, desc: かたむきがこの秒数つづいたら止まる（段差を越えるときの一瞬のゆれでは止まらない）}
      - {name: cliff_avoid_m, ref: autonomy_node.cliff_avoid_m, unit: m, desc: 前の段差センサーが反応した所（車の 0.2 m 前）を SLAM の地図の上で覚え（地図の位置が分からなければ /odom）、その所のこの幅 m 以内を通る向きは曲がる先・横へずれる向きに選ばない。まっすぐ前の車の幅の帯にあれば前の障害物と同じにみる}
      - {name: cliff_file, ref: autonomy_node.cliff_file, desc: 段差の印（map の x, y）の保存先。今の slam_toolbox が動きはじめてから保存したものだけ読む（地図は slam_toolbox の起動ごとに作り直すため）。ダッシュボードの地図クリアで消える（cliff_clear_topic）。ダッシュボードの地図に赤い点で出る}
      - {name: cliff_edit_topic, ref: autonomy_node.cliff_edit_topic, desc: ダッシュボードの地図で「段差の印」にチェックを入れてクリックすると、そこに印を置く（赤い点をクリックで消す）。POST /api/cliff_marks → この topic}
      - {name: scan_max_age, ref: autonomy_node.scan_max_age, unit: s, desc: LiDAR がこれより古いと停止}
      - {name: nav_cmd_timeout, ref: autonomy_node.nav_cmd_timeout, unit: s, desc: Nav2 の速度（/cmd_vel_nav）がこれより古ければゼロ}
      - {name: nav_auto_wait, ref: autonomy_node.nav_auto_wait, unit: s, desc: 「ここへ行く」から自動に入らないままこの秒数で行き先をやめる}
    layer: control
  - id: perception_node
    label: perception_node
    file: ai_car_web/perception_node.py
    role: LiDAR 360° を 5° ごとに、車体の端（body_box_m）から物までの空き（move）と、左右に回れる角度（turn_free_deg）を出す。前方 ±30° を左 / 中央 / 右で評価し 停止 / 減速 / 安全 / 不明 を判定。カメラ画像を AI HAT+（YOLOv8m）で推論し、LiDAR の同方位距離を物体に付与。温度で推論レートを制御し、複数フレームで検出を確認
    publishes: [/obstacle_status]
    subscribes: [/scan, /camera/image_raw/compressed, /system_status, /jetson_detections]
    params:
      - {name: stop_distance, ref: perception_node.stop_distance, unit: m, desc: 停止判定}
      - {name: slow_distance, ref: perception_node.slow_distance, unit: m, desc: 減速判定}
      - {name: body_box_m, ref: perception_node.body_box_m, unit: m, desc: 360° の見張りの車体の箱（LiDAR の中心から 後ろ・前・右・左 の端）}
      - {name: move_stop_gap, ref: perception_node.move_stop_gap, unit: m, desc: 動く向きの車体の端から物までがこれ以下で、その向きの動きを止める}
      - {name: move_slow_gap, ref: perception_node.move_slow_gap, unit: m, desc: 手動ではこれ以下で半分の速さ}
      - {name: turn_stop_deg, ref: perception_node.turn_stop_deg, unit: deg, desc: その向きに回れる角度がこれより小さいと、その向きの回転を止める（反対向きは回れる）}
      - {name: danger_distance, ref: perception_node.danger_distance, unit: m, desc: 検出枠・LiDAR の点を「危険」の色にする距離}
      - {name: living_guard, ref: perception_node.living_guard, unit: '', desc: 人・動物の検出で減速・停止する（手動・自動とも。false は表示のみ）}
      - {name: living_slow_distance, ref: perception_node.living_slow_distance, unit: m, desc: 人・動物がこの距離以内で減速}
      - {name: living_stop_distance, ref: perception_node.living_stop_distance, unit: m, desc: 人・動物がこの距離以内で停止}
      - {name: inference_rate, ref: perception_node.inference_rate, unit: Hz, desc: 推論レート上限}
      - {name: score_threshold, ref: perception_node.score_threshold, unit: '', desc: 検出信頼度の下限}
      - {name: detect_confirm_frames, ref: perception_node.detect_confirm_frames, unit: frame, desc: 検出を確定するフレーム数}
      - {name: detect_history_frames, ref: perception_node.detect_history_frames, unit: frame, desc: 検出確認に使う履歴長}
      - {name: model_gops, ref: perception_node.model_gops, unit: GOP, desc: YOLOv8m 640x640 の演算量（AI HAT+ の負荷率の表示用）}
      - {name: cpu_temp_warn, ref: perception_node.cpu_temp_warn, unit: ℃, desc: 推論 40% へ}
      - {name: cpu_temp_crit, ref: perception_node.cpu_temp_crit, unit: ℃, desc: 推論停止（LiDAR 判定は継続）}
      - {name: hailo_temp_warn, ref: perception_node.hailo_temp_warn, unit: ℃, desc: 推論 40% へ}
      - {name: hailo_temp_crit, ref: perception_node.hailo_temp_crit, unit: ℃, desc: 推論停止}
    layer: perception
  - id: rplidar
    label: rplidar（rplidar_ros）
    file: 外部パッケージ ros-jazzy-rplidar-ros
    role: RPLIDAR A1M8 を読み /scan を約 8 Hz で publish（launch 側で respawn）
    publishes: [/scan]
    subscribes: []
    params: []
    layer: sensor
  - id: lidar_watchdog_node
    label: lidar_watchdog_node
    file: ai_car_web/lidar_watchdog_node.py
    role: /scan が途絶えたら rplidar を終了させ、launch の respawn で起動し直させる（USB の抜き差し対策）。何度も戻らなければ LiDAR の USB をつなぎ直し、それでも戻らなければ USB の電気を切って入れ直し、最後はラズパイを再起動する
    publishes: []
    subscribes: [/scan]
    params:
      - {name: scan_timeout, ref: lidar_watchdog_node.scan_timeout, unit: s, desc: この秒数 /scan が来ないと rplidar を起動し直す}
      - {name: startup_grace, ref: lidar_watchdog_node.startup_grace, unit: s, desc: 起動直後と起動し直した後に待つ秒数}
      - {name: kill_wait, ref: lidar_watchdog_node.kill_wait, unit: s, desc: SIGTERM で終わらなければ SIGKILL を送るまでの秒数}
      - {name: usb_reset_after, ref: lidar_watchdog_node.usb_reset_after, unit: 回, desc: 起動し直しても /scan が戻らないことがこの回数続くと、LiDAR の USB をつなぎ直す（0 でしない）}
      - {name: power_cycle_after, ref: lidar_watchdog_node.power_cycle_after, unit: 回, desc: この回数続くと、USB の電気を 3 秒切って入れ直す（ゲームパッドも数秒切れる。0 でしない）}
      - {name: power_cycles, ref: lidar_watchdog_node.power_cycles, unit: 回, desc: USB の電気を入れ直す回数}
      - {name: reboot_after, ref: lidar_watchdog_node.reboot_after, unit: 回, desc: この回数続くと、ラズパイを再起動する（この起動で /scan が来ていたときだけ。0 でしない）}
      - {name: reboot_min_uptime, ref: lidar_watchdog_node.reboot_min_uptime, unit: s, desc: 起動からこの秒数たつまでは再起動しない（くり返さないため）}
    layer: sensor
  - id: camera
    label: camera（camera_ros）
    file: 外部パッケージ camera_ros + Raspberry Pi 版 libcamera
    role: IMX708 を 960×540 30fps で取り込み JPEG（品質 80）で publish。use_camera で起動（launch 側で respawn）
    publishes: [/camera/image_raw/compressed]
    subscribes: []
    params: []
    layer: sensor
  - id: imu_node
    label: imu_node
    file: ai_car_web/imu_node.py
    role: GY-BNO055（I2C 0x29）を AMG モード（加速度・ジャイロ・磁気の生の値）で読み、向きはラズパイで計算して /imu/data・/imu/mag を 20 Hz で publish
    publishes: [/imu/data, /imu/mag, /imu/mag_status]
    subscribes: []
    params: []
    layer: sensor
  - id: cliff_node
    label: cliff_node
    file: ai_car_web/cliff_node.py
    role: 前後バンパーの VL53L1X ×2（I2C 0x30 / 0x31、XSHUT で起動時にアドレス変更）で 45° 前方の床までの距離を測り、床を 0 mm とした高さに直して、20 mm 以上低い所（段差・床の途切れ）を /cliff_status に 20 Hz で publish。front_wired / rear_wired で配線したほうだけを使う（未配線の側は level unwired）。使う側の XSHUT はノードが動くあいだ握ったままにし、つなぎ直しのときも L にもどす（離すと 0x29 で起きて BNO055 とぶつかる）。wired false の間は I2C / GPIO に触らず「未配線」だけを配信
    publishes: [/cliff_status]
    subscribes: []
    params:
      - {name: wired, ref: cliff_node.wired, unit: '', desc: 配線済みなら true（false の間はセンサーを読まない）}
      - {name: front_wired, ref: cliff_node.front_wired, unit: '', desc: 前のセンサー（0x30・XSHUT GPIO17）を使う}
      - {name: rear_wired, ref: cliff_node.rear_wired, unit: '', desc: 後ろのセンサー（0x31・XSHUT GPIO27）を使う}
      - {name: cliff_height_cm, ref: cliff_node.cliff_height_cm, unit: cm, desc: 床（0 cm）よりこれ以上低ければ段差}
      - {name: front_floor_distance_m, ref: cliff_node.front_floor_distance_m, unit: m, desc: 前の平らな床までの距離（高さ 0 cm の基準）}
      - {name: rear_floor_distance_m, ref: cliff_node.rear_floor_distance_m, unit: m, desc: 後の平らな床までの距離（高さ 0 cm の基準）}
      - {name: tilt_deg, ref: cliff_node.tilt_deg, unit: °, desc: 真下から進行方向へのかたむき（高さ = 距離の差 × cos）}
      - {name: confirm_count, ref: cliff_node.confirm_count, unit: 回, desc: 連続で超えたら段差と確定}
      - {name: invalid_is_cliff, ref: cliff_node.invalid_is_cliff, unit: '', desc: 床が見えない（測定無効）も段差とみなす}
      - {name: timing_budget_ms, ref: cliff_node.timing_budget_ms, unit: ms, desc: 1 回の測定時間（短距離モード）}
    layer: sensor
  - id: slam_toolbox
    label: slam_toolbox
    file: launch/slam.launch.py
    role: 地図と自己位置（online async SLAM）。use_slam（既定 true）で起動。odom → base_footprint は encoder_odom_node の TF（use_odom:=false なら固定の TF にしてスキャンの照合だけ）。robot_state_publisher が URDF から base_link → laser の TF を出す
    publishes: [/map, /pose, /tf]
    subscribes: [/scan, /tf]
    params:
      - {name: resolution, ref: slam_toolbox.resolution, unit: m, desc: 地図の 1 セルの大きさ}
      - {name: max_laser_range, ref: slam_toolbox.max_laser_range, unit: m, desc: 地図に使うスキャンの距離}
      - {name: minimum_travel_distance, ref: slam_toolbox.minimum_travel_distance, unit: m, desc: この距離動いたらスキャンを使う（/odom つきで 0.1）}
      - {name: map_update_interval, ref: slam_toolbox.map_update_interval, unit: s, desc: /map を出す間隔}
    layer: perception
  - id: system_monitor_node
    label: system_monitor_node
    file: ai_car_web/system_monitor_node.py
    role: CPU / メモリ / PMIC 電圧・電流 / スロットリング / Hailo-8 温度を 1 Hz で /system_status に publish（読み取りのみ）
    publishes: [/system_status]
    subscribes: []
    params: []
    layer: sensor

topics:
  - {name: /scan, type: sensor_msgs/LaserScan, desc: LiDAR 360° スキャン（約 8 Hz）}
  - {name: /camera/image_raw/compressed, type: sensor_msgs/CompressedImage, desc: カメラ JPEG（Camera Module 3 Wide、30 Hz）}
  - {name: /imu/data, type: sensor_msgs/Imu, desc: 姿勢・角速度・加速度（20 Hz）}
  - {name: /imu/mag, type: sensor_msgs/MagneticField, desc: 磁気（T、20 Hz、AMG / NDOF のときだけ。補正をかけて 1 秒平均）}
  - {name: /imu/mag_status, type: std_msgs/String, desc: 磁気の補正の状態・ゆれ・乱れの判定（JSON、2 Hz）}
  - {name: /cliff_status, type: std_msgs/String (JSON), desc: 落下防止センサーの段差判定 level（unwired / unknown / floor / cliff）・前後の床からの高さ height_cm（床 0 cm）と距離・前進 / 後退の停止（20 Hz）}
  - {name: /system_status, type: std_msgs/String (JSON), desc: Pi / AI HAT+ の状態（1 Hz）}
  - {name: /obstacle_status, type: std_msgs/String (JSON), desc: 障害物判定 level / 距離 / 検出物体（5 Hz）}
  - {name: /jetson_detections, type: std_msgs/String (JSON), desc: Jetson（NanoOWL）の物体検出（名前・信頼度・画面の位置）。POST /api/jetson/detections から dashboard_node が流す。表示のみ}
  - {name: /joy_cmd, type: geometry_msgs/Twist, desc: ゲームパッドの正規化指令（10 Hz）}
  - {name: /cmd_vel_manual, type: geometry_msgs/Twist, desc: Web + ゲームパッドの手動速度指令}
  - {name: /cmd_vel_auto, type: geometry_msgs/Twist, desc: 自律走行の速度指令（10 Hz、AUTO 以外はゼロ）}
  - {name: /nav_goal, type: std_msgs/String (JSON), desc: '地図の行き先 {action: plan|go|cancel, x, y, yaw_deg}（map 座標）。POST /api/nav から dashboard_node が流す'}
  - {name: /cmd_vel_nav, type: geometry_msgs/Twist, desc: Nav2（controller_server）の速度指令。autonomy_node が AUTO で行き先があるときだけ /cmd_vel_auto へ中継}
  - {name: /plan, type: nav_msgs/Path, desc: Nav2（planner_server）が考えた行き先までの道}
  - {name: /drive_mode_request, type: std_msgs/String (JSON), desc: 'モード切替要求 {mode: manual|auto|stop|toggle, source}'}
  - {name: /drive_mode, type: std_msgs/String (JSON), desc: 現在の運転モードと拒否理由（5 Hz・transient local）}
  - {name: /cmd_vel, type: geometry_msgs/Twist, desc: 最終速度指令（drive_mode_node のみが publish）}
  - {name: /drive_output, type: std_msgs/Float32, desc: ダッシュボードの「出力」の割合（0.1〜1.0）。drive_mode_node が手動・ゲームパッド・自動の最大の速さに使う}
  - {name: /motor_status, type: std_msgs/String (JSON), desc: motor_driver_node の 4 輪の出力・Motor HAT のつながり・heading_hold の様子}
  - {name: /autonomy_status, type: std_msgs/String (JSON), desc: 自律行動・セクター距離・自動指令}
  - {name: /odom, type: nav_msgs/Odometry, desc: 車輪のオドメトリ（encoder_odom_node、20 Hz）}
  - {name: /map, type: nav_msgs/OccupancyGrid, desc: SLAM の地図（5 cm / セル、2 秒ごと、transient local）}
  - {name: /pose, type: geometry_msgs/PoseWithCovarianceStamped, desc: 地図の上の自己位置（slam_toolbox）}

drive_modes:
  states:
    - {id: manual, label: 手動, desc: /cmd_vel_manual（Web + ゲームパッド）を /cmd_vel へ中継。起動時の既定}
    - {id: auto, label: 自動, desc: /cmd_vel_auto（autonomy_node）を 10 Hz で中継}
    - {id: stop, label: 停止, desc: ゼロ速度を定期的に publish。手動指令は無視し、明示的に「手動」へ戻す必要がある}
  transitions:
    - {from: manual, to: auto, trigger: Web「自動」/ START 長押し, condition: 進入条件をすべて満たす（下記）}
    - {from: auto, to: manual, trigger: 手動指令（スティック / Web）を検出, condition: manual_override}
    - {from: auto, to: stop, trigger: 自動指令が auto_timeout 途絶 / ゲームパッド切断 / LiDAR 判定途絶, condition: watchdog / guard}
    - {from: manual, to: stop, trigger: 手動指令が manual_timeout 途絶（移動中）, condition: watchdog}
    - {from: auto, to: stop, trigger: 配線済みの落下防止センサーの判定が途絶・不明（段差を見ただけでは止めず、下がって回る）, condition: cliff_guard}
    - {from: any, to: stop, trigger: Web「停止」・赤い停止ボタン（/api/stop）/ BACK / 自動中の B, condition: 常に}
    - {from: stop, to: manual, trigger: Web「手動」/ START 長押し, condition: 常に}
    - {from: stop, to: auto, trigger: Web「自動」/ START 長押し, condition: 進入条件をすべて満たす}
  auto_entry_conditions:
    - /obstacle_status が新鮮（obstacle_timeout 以内）で level が unknown でない（前に物があって stop でも入れる。入ったら空いている側へ回る）
    - ゲームパッドが接続中（auto_requires_joy）
    - スティック・手動操作がニュートラル
    - /cmd_vel_auto が生きている（autonomy_node 起動中）
    - 落下防止センサーが配線済み（wired true）なら、/cliff_status が新鮮（cliff_timeout 以内）で段差・不明でない
  safety:
    - {name: Web 指令タイムアウト, where: dashboard_node, ref: dashboard_node.cmd_timeout, unit: s, desc: 無指令でゼロ速度}
    - {name: 手動 watchdog, where: drive_mode_node, ref: drive_mode_node.manual_timeout, unit: s, desc: MANUAL 中の手動指令途絶で STOP}
    - {name: 自動 watchdog, where: drive_mode_node, ref: drive_mode_node.auto_timeout, unit: s, desc: AUTO 中の自動指令途絶で STOP}
    - {name: LiDAR 途絶, where: drive_mode_node, ref: drive_mode_node.obstacle_timeout, unit: s, desc: 障害物判定が古ければ AUTO を拒否 / STOP}
    - {name: ゲームパッド切断, where: drive_mode_node, ref: drive_mode_node.joy_timeout, unit: s, desc: AUTO 中の切断で STOP}
    - {name: 障害物最終ガード, where: drive_mode_node / dashboard_node, ref: '', unit: '', desc: どのモードでも、LiDAR 360° で動く向き（前後左右・ななめ）の車体の端から 0.25 m 以内に物があればその向きの動きを、その向きに回ると当たるならその向きの回転を 0 にする。手動は 0.7 m 以内で半分の速さ（前進は 1 眼の低い物などの speed_scale も使う）}
    - {name: 段差ガード, where: drive_mode_node, ref: drive_mode_node.cliff_guard, unit: '', desc: 前のセンサーが段差なら前進、後ろなら後退を 0 にする。AUTO は止めず、autonomy_node が下がって回って走行を続ける。未配線・判定が古いときは止めない}
    - {name: モード遷移時のゼロ速度, where: drive_mode_node, ref: '', unit: '', desc: 遷移時と起動時に必ず一度ゼロ速度を publish}
    - {name: サーマル制御, where: perception_node, ref: '', unit: '', desc: CPU 70℃ / Hailo 75℃ で推論 40%、78℃ / 85℃ で推論停止（LiDAR 判定は継続）}
    - {name: API トークン認証, where: dashboard_node, ref: '', unit: '', desc: api_token 設定時は POST API に X-API-Token / Bearer が必須}

autonomy:
  sectors:
    - {id: front, label: 前, angle: ±30°（front_angle_deg 60°）, use: 減速 / 旋回 / 後退判定}
    - {id: front_left, label: 前左, angle: 前セクターの左半分 0°〜30°, use: 旋回方向の選択}
    - {id: front_right, label: 前右, angle: 前セクターの右半分 0°〜-30°, use: 旋回方向の選択}
    - {id: left, label: 左, angle: 30°〜150°, use: 旋回方向 / 後退判定}
    - {id: right, label: 右, angle: -30°〜-150°, use: 旋回方向 / 後退判定}
    - {id: back, label: 後, angle: 180°±30°, use: 後退の安全確認（測距なしなら後退しない）}
  behaviors:
    - {id: forward, label: 前進, condition: 前方 > slow_distance, output: linear.x = cruise_speed}
    - {id: slow, label: 減速, condition: stop_distance < 前方 ≤ slow_distance, output: linear.x = slow_speed、近い側から離れる方向へ緩く旋回}
    - {id: turn, label: 旋回, condition: 前方 ≤ stop_distance, output: 曲がる先の向き（360° のうち車の幅で explore_min_free 以上進める向きから、遠く・まだ行っていない所ほど選ばれやすいランダム）へ angular.z = ±turn_speed。その向きまで回る（最大 explore_turn_timeout）。/odom・候補がなければ空いている側（両方空いていればランダム）へ、前方が clear_distance 以上空くまで（最短 min_turn_sec ＋ 0〜turn_random_sec）}
    - {id: backoff, label: 後退, condition: 前・左・右 ≤ backoff_distance かつ 後方に測距があり > stop_distance, output: linear.x = −backoff_speed}
    - {id: cliff_back, label: 段差から後退, condition: 前の落下防止センサーが段差（block_forward）, output: /odom で cliff_backoff_m 下がるまで linear.x = −backoff_speed（後ろも段差なら次へ）}
    - {id: cliff_turn, label: 段差から旋回, condition: cliff_back のあと前が床, output: 空いている側へ angular.z = ±turn_speed を /odom で cliff_turn_deg 回るまで → ふつうの走行へ}
    - {id: cliff_stuck, label: 停止（段差で動けない）, condition: 前後とも段差 / /odom なし / 下がっても前が段差のまま, output: ゼロ速度（前が床にもどれば続ける）}
    - {id: tilted, label: 停止（かたむいた）, condition: /imu/data の roll / pitch が AUTO に入ったときより tilt_stop_deg 以上を tilt_hold_sec つづけた（落ちた・乗り上げた）, output: ゼロ速度（AUTO に入り直すまで）。かたむいた所（車のまん中）を段差の印にする（横の段差はセンサーで見えないため）}
    - {id: blocked, label: 待機（LiDAR なし）, condition: /scan が scan_max_age より古い, output: ゼロ速度}
  perception_flow:
    - LiDAR /scan → 取り付け向き補正（scan_angle_offset_deg、前方カメラの正面に合わせた −1.7°）→ 前方 ±30° を左 / 中央 / 右で最短距離 → stop / slow / clear / unknown
    - （10 回/秒）カメラ JPEG → 640×640 にレターボックス → Hailo-8 YOLOv8m（78.9 GOP）→ 元画像座標へ検出枠を復元 → camera_hfov_deg で方位角へ → LiDAR の点をカメラの位置（camera_offset_x_m / _y_m、前 63 mm・横 0 mm）から見た方位に直し、同方位クラスタ（cluster_gap）の中央値を距離として付与
    - LiDAR /scan → 360° を 5° ごとに車体の端からの空き（move）と左右に回れる角度（turn_free_deg）→ drive_mode_node が動く向き・回る向きごとに止める
    - /obstacle_status → drive_mode_node（最終ガード・AUTO 進入条件）、autonomy_node、dashboard_node（表示）

api:
  rest:
    - {method: GET, path: /, desc: ダッシュボード HTML, auth: false}
    - {method: GET, path: /api/status, desc: テレメトリ一式（cmd_vel / scan / imu / system / obstacle / camera / drive_mode / autonomy / cliff / slam（places つき） / route / jetson_host / joy / lidar（よごれチェック。ratio・far_m・ok・bad_s））, auth: false}
    - {method: GET, path: /api/gpio, desc: 40 ピンヘッダーと Motor HAT の 3V3 / GND（各 6 本）の配線表, auth: false}
    - {method: GET, path: /api/motor_hat, desc: Motor HAT M1〜M4 割り付けとエンコーダーピン, auth: false}
    - {method: POST, path: /api/imu/mag_calibrate, desc: 磁気の補正を始める（30 秒のあいだ床で 1〜2 回まわす。imu_node の /imu/mag_calibrate）, auth: true}
    - {method: GET, path: /api/version, desc: バージョン（package.xml）・公開日（CHANGELOG）・いまの git の版, auth: false}
    - {method: GET, path: /api/architecture, desc: この説明画面の構成定義（実機の生存トピック付き）, auth: false}
    - {method: GET, path: '/api/program?file=…', desc: プログラム一覧に登録したファイルの中身（一覧にないファイルは 404）, auth: false}
    - {method: GET, path: /api/dev_diary, desc: "開発日記（main の PR マージ・コミットと CHANGELOG の追加行を日付ごとにまとめたもの）。DB（~/.ros/ai_car_dev_diary.sqlite）から ?days=7&before=日付&tag=分類 で 7 日ずつ返す", auth: false}
    - {method: GET, path: /api/drive_mode, desc: 現在の運転モード, auth: false}
    - {method: GET, path: '/print3d/{file}', desc: 3D プリント部品の STL・図・OpenSCAD ソース（hardware/3d/battery_lidar_mount）, auth: false}
    - {method: POST, path: /api/cmd_vel, desc: '手動速度指令 {linear_x, linear_y, angular_z} (−1〜1)', auth: true}
    - {method: POST, path: /api/drive_output, desc: 'ダッシュボードの「出力」{percent}（手動・ゲームパッド・自動・声の最大の速さ）', auth: true}
    - {method: POST, path: /api/slam/save, desc: "今の SLAM の地図を .pgm / .yaml と、名前（name）を付けた slam_toolbox の地図データ・段差の印・車の位置・カメラの写真で保存（同じ名前は上書き）", auth: true}
    - {method: GET, path: /api/slam/maps, desc: 名前を付けて保存した地図の一覧（車を置く位置・向き、段差の印、使用中の地図）}
    - {method: GET, path: "/api/slam/maps/{id}/map.png", desc: 保存した地図の絵（/photo.jpg は保存したときのカメラの写真）}
    - {method: POST, path: /api/slam/maps/load, desc: 選んだ地図を、保存したときの車の位置から始めるように読みこむ（止まっているときだけ）, auth: true}
    - {method: POST, path: /api/slam/maps/rename, desc: 保存した地図の名前を変える（/delete で消す）, auth: true}
    - {method: POST, path: /api/slam/clear, desc: SLAM の地図を消して今いる所から作り直す（slam_toolbox の reset。行き先もやめる）, auth: true}
    - {method: POST, path: /api/slam/mapping, desc: '地図作り {action: go|cancel|north, deg}。go は地図を消し、10 秒止まって北をはかってから、まだ見ていない所のはしを Nav2 で回り、最後にスタートにもどる（出力 10%、もどるときは 20%、15 分まで）。LiDAR がよごれていると、地図を消さずに始めない。north は北の向きを deg 度直す', auth: true}
    - {method: GET, path: /api/places, desc: '今の地図の緑の点（名前つきの場所） {places: [{name, x, y}], map}', auth: false}
    - {method: POST, path: /api/places, desc: '緑の点 {action: add|remove|rename, name, x, y, here, new_name}。add で here なら今の車の所。保存した地図を使っていれば、その <id>.json の places に書く', auth: true}
    - {method: POST, path: /api/route, desc: '緑の点を順に回る {action: go|cancel, names}。点ごとに /nav_goal に go を流し、着いたら次へ。進めなくなったら道を考えなおしてまわり道（3 回まで）。道がない点・停止・手動でそこで止まって手動にもどる。ようすは /api/status の route（retries）', auth: true}
    - {method: GET, path: /api/patrol, desc: '前のパトロールの結果（新しい順 10 回） {reports: [{pid, state, arrived, skipped, anomalies: [{kind: person|object|cliff, x, y, where, text, photo}], duration_s}]}', auth: false}
    - {method: GET, path: /api/patrol/plan, desc: 'パトロールで回る所と順番だけ（走らない） {stops, line_m}', auth: false}
    - {method: GET, path: '/api/patrol/<pid>/<n>.jpg', desc: 'パトロールでとった写真', auth: false}
    - {method: POST, path: /api/patrol, desc: 'パトロール {action: go|cancel}。見る所ごとに /nav_goal に go、着いたら 90° ずつ 4 回向きを変えて見る。行けない所はとばす。最後にスタートへもどる（見ない）。15 分まで。LiDAR がよごれていると始めない。ようすは /api/status の route（kind: patrol）', auth: true}
    - {method: POST, path: /api/nav, desc: '地図の行き先 {action: plan|go|cancel, x, y, yaw_deg}。plan は道だけ（動かない）、go は運転モードを自動にして向かう', auth: true}
    - {method: GET, path: /api/slam/map.png, desc: 今の SLAM の地図の画像, auth: false}
    - {method: POST, path: /api/mypc/status, desc: パソコンの状態（温度・負荷率・メモリ・更新）, auth: true}
    - {method: POST, path: '/api/mypc/{action}', desc: パソコンの再起動・更新（reboot / upgrade）を頼む（次に状態が届いたときの返事で伝える）, auth: true}
    - {method: POST, path: /api/stackchan/backend, desc: スタックちゃんの考える所を Jetson / パソコンに切り替える, auth: true}
    - {method: POST, path: /api/stackchan/pc_voice, desc: パソコンの声（VOICEVOX の話者）を選ぶ, auth: true}
    - {method: POST, path: /api/stackchan/photo, desc: スタックちゃんで 5 秒数えて撮影する（GET /api/stackchan/photo.jpg で写真）, auth: true}
    - {method: POST, path: /api/stackchan/enroll, desc: 撮った写真の顔を名前で登録する, auth: true}
    - {method: POST, path: /api/stackchan/stream, desc: スタックちゃんのカメラの配信を始める・止める（GET /api/stackchan/frame.jpg で今の 1 枚）, auth: true}
    - {method: POST, path: /api/stop, desc: 全モード停止（ゼロ速度 + stop モード要求）, auth: true}
    - {method: POST, path: /api/drive_mode, desc: 'モード切替 {mode: manual|auto|stop}', auth: true}
    - {method: POST, path: /api/jetson/detections, desc: Jetson（NanoOWL）の物体検出 → /jetson_detections, auth: true}
    - {method: POST, path: /api/jetson/status, desc: Jetson の状態（温度・メモリ・電力・AI の部品・更新・IP アドレス）。/api/status の jetson_host に出す。返事の reboot が true なら Jetson は再起動する、poweroff が true なら電源を切る、upgrade が true なら jetson-upgrade.service で更新する, auth: true}
    - {method: POST, path: /api/jetson/reboot, desc: Jetson の再起動を頼む（次に状態が届いたときの返事で伝える。未接続なら 409）, auth: true}
    - {method: POST, path: /api/jetson/poweroff, desc: Jetson の電源を切ることを頼む（次の返事で伝える。未接続なら 409、sudoers に poweroff がなければ 503）。もう一度入れるのは本体の電源ボタンか電源のつなぎ直し, auth: true}
    - {method: POST, path: /api/jetson/upgrade, desc: Jetson の更新（NVIDIA の部品以外）を頼む（次の返事で伝える。未接続・更新中なら 409、sudoers がなければ 503）, auth: true}
    - {method: POST, path: /api/system/reboot, desc: ラズパイを 10 秒後に再起動する（止めてから。そのあいだも Jetson の再起動を受け付け、頼みが残っていれば伝え終わるまで最長 10 秒待つ。走行中・自動運転中は 409）, auth: true}
    - {method: POST, path: /api/system/poweroff, desc: ラズパイの電源を 10 秒後に切る（止めてから。再起動と同じく、そのあいだに頼んだ Jetson の再起動・電源を切ることも伝え終わってから。走行中・自動運転中は 409、sudoers に poweroff がなければ 503）, auth: true}
    - {method: POST, path: /api/system/upgrade, desc: ラズパイの更新（ai-car-upgrade.service、ROS 2 も含む）を始める（走行中・自動運転中は断る。ai-car-upgrade.sudoers が必要）, auth: true}
    - {method: GET, path: /api/camera/snapshot, desc: JPEG 1 枚, auth: false}
    - {method: GET, path: /api/stackchan/status, desc: スタックちゃんのカード用。Jetson の stackchan_bridge（8003 の /status）のつながり・今の様子・最後の会話・IP アドレスをそのまま返す（表示だけ）, auth: true}
    - {method: GET, path: /api/camera/stream, desc: MJPEG ストリーム, auth: false}
    - {method: WS, path: /ws, desc: テレメトリ配信（telemetry_rate Hz）。未導入環境は /api/status ポーリングにフォールバック, auth: false}
  auth_note: dashboard_node.api_token または環境変数 AI_CAR_API_TOKEN を設定すると auth=true の API に X-API-Token（または Authorization Bearer）ヘッダーが必要。UI は ?token= を一度開くと localStorage に保存する

status:
  known_issues:
    - 電源は PD なし（バッテリー PD 12V → DROK 5.2V → USB-A → ラズパイ）。ラズパイは 3 A の電源と見ている（usb_max_current_enable=1 で USB に 1.6 A まで）。Camera Module 3 Wide にしてからは電圧低下 0 回だが、余裕は少ない
    - 落下防止センサー（VL53L1X ×2）は前後とも配線済み（0x30 / 0x31 で距離が読める）。段差の前で本当に止まるかは、床でまだ確かめていない
    - LiDAR は床から約 17.5 cm の高さだけを見る。それより低い物・細い物は 360° の見張りで止まらないことがある
    - LiDAR のレンズがよごれると、遠くが見えなくなる（2026-10-23、どの方向も 1.4〜1.8 m まで。1 m の通路が 36 cm に見えた。ふくと 3.8 m にもどった）。よごれチェックのしきい値（65%・2.5 m）は、2 回の数字から決めた仮の値
    - /odom の横移動は寸法からの計算値（前後は 1.8 m、旋回は 1.5 回転で床合わせ済み）
    - IMU（BNO055）の加速度の補正は 0 のまま（ジャイロ 3）。傾きのずれは 1〜2°。磁気は LiDAR の下で地球の約 3 倍あり、向きは目安だけ
    - カメラと LiDAR の外部キャリブレーション未実施（同軸・同方向前提）
    - Jetson のケースの OLED（I2C）は、ときどき書きこみがタイムアウトする（24 時間で 31 回）。画面が 1 回更新されないだけで、ほかには影響しない
  next:
    - 360° の見張りを床で確かめる（出力 15 %。前後・左右・ななめ・回転で 0.25 m の所で止まるか、物から離れる向きには動けるか）
    - スタックちゃんの声で走るのを床で確かめる（「前に 50 センチ進んで」「右に 90 度回って」「止まって」）
    - 緑の点を順に回るのを床で確かめる（点 2 つ。「台所、玄関の順で移動して」「止まって」、行けない点で止まるか）
    - SLAM の地図を部屋 1 周で作って、壁が二重にならないか確かめる
    - 実機で自動モードの旋回方向・速度・しきい値を調整
    - 前後の落下防止センサー（VL53L1X）で、段差の前で止まるかを床で確かめる（台の端に向けて「出力」15 % でゆっくり）
    - /odom の横移動を床で合わせる
    - Nav2 の探索（まだ行っていない所へ行く）を床で続けて調整する（v1.10〜v1.11 の試走で、行けない行き先・TF エラー・段差の前の行き先・せまい通路の尻振りを直した）
  docs:
    - {name: README.md, desc: セットアップ・実行・各デバイスの導入手順}
    - {name: PROJECT_STATUS.md, desc: 実装済み機能・既知の問題・テスト結果・次回作業}
    - {name: PROJECT_RULES.md, desc: 開発ルール}
    - {name: HARDWARE_BOM.md, desc: 部品構成表・電源系統}
    - {name: hardware/3d/battery_lidar_mount/README.md, desc: 3D プリント部品の寸法・ネジ穴・配線経路・組み立て}
    - {name: CHANGELOG.md, desc: 変更履歴}

