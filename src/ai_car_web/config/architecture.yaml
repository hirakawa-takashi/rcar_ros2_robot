  settings:
    - {name: 材料, value: 全部品 PLA で印刷できる（バンパーの板ばねのひずみ約 1.1 %、カバーのフック約 0.9 %。どちらも PLA の降伏ひずみ約 2 % の半分ほど）。PLA は 55〜60 ℃ で柔らかくなるので、夏の車内など熱いところに置かない。カバーを付けて長く動かすときは、Pi の上のラズパイ台とカバーが熱で変形しないか確かめる}
    - {name: ノズル / 積層ピッチ, value: 0.4 mm / 0.2 mm（目安）}
    - {name: 壁, value: 3 周以上（ねじ込み穴のまわりを厚くするため）。板ばね 0.8 mm は壁 2 周だけでできる}
    - {name: 充填, value: 20〜30 %（目安）}
    - {name: サポート, value: 不要（全部品、STL の向きのまま印刷）。カバーは上面を下にして印刷するので、窓の上辺（Z 方向の穴の天井）は 24 mm 以下のブリッジになる}
    - {name: プリンター, value: Creality K1C（印刷範囲 220 × 220 × 250 mm）で全部品を一体で印刷できる。いちばん大きいのはカバー（約 164 × 212 × 88 mm）と試験台（167.4 × 202 × 88 mm）}
    - {name: ブリム, value: 任意。箱（148 × 92 mm）は反りやすいので、反るときは付ける}
  screws:
    - {place: 天板への取付（箱のフランジ、ラズパイ台の腕、バンパーの腕）, screw: 天板の今のネジ（長いものに交換）, hole: Ø4.4 の通し穴}
    - {place: ふた → 箱のボス（4 か所）, screw: M3 × 12 mm, hole: 'ふた: Ø3.4 の通し穴 / 箱: M3 のねじ込み穴 深さ 12 mm'}
    - {place: LiDAR → ふたの柱（4 か所）, screw: M2.5 × 8 mm, hole: 下から座ぐり Ø5.2、上端 4 mm に Ø2.9 の通し穴}
    - {place: Camera Module 3 Wide → カメラの板の支柱（4 か所）, screw: M2 × 6 mm（ナットで留めるときは M2 × 8〜10 mm）, hole: '支柱 Ø4.6・高さ 4 mm に Ø2.5 の下穴（板を貫通）/ 板の裏に M2 ナットの六角のくぼみ（二面幅 4.4 mm、深さ 1.8 mm）/ ふた・箱の前の面に逃げ穴（Ø6.5、深さ 4 mm）'}
    - {place: カメラの板の耳 → ふたの前端の柱（左右 2 か所）, screw: M3 × 8 mm, hole: '耳: Ø3.4 の通し穴 / 柱: M3 のねじ込み穴（Ø2.5、柱を貫通）'}
    - {place: Pi 5 の M2.5 六角支柱（幅 5 mm）→ ラズパイ台のボス（4 か所）, screw: M2.5 × 6 mm（台の裏から支柱のメスねじへ）, hole: '支柱を差し込む丸い穴 Ø6.2 深さ 5 mm / 底に Ø2.9 の通し穴 / 裏から座ぐり Ø5.2 深さ 2 mm'}
    - {place: DROK → 箱の後ろの壁, screw: 結束バンド 1 本（幅 3.6 mm まで）, hole: 取付穴がないため、受けの溝に立てて締める}
    - {place: 上面カバー → 天板, screw: ネジなし（左右 4 個のフック。右前は固定の爪）, hole: 天板の左右の端の裏（後ろの端から 54 mm・前の端から 30 mm）に、フックの爪（奥行き 2.3 mm）が掛かる。フックの両隣の受けが天板の上面に載る}
  screw_note: ねじ込み穴は下穴（M2 Ø1.7 / M2.5 Ø2.1 / M3 Ø2.5）。普通の小ネジをねじ込むと、ネジ自身が樹脂にねじ山を切る。きつい・ゆるいときは SCAD の tap_d を 0.1 mm ずつ変える。screw_mode="insert" で熱圧入インサート用の穴にも切り替えられる
  assembly:
    - 天板の前側 4 本のネジを外し、フランジの厚さ（3 mm）ぶん長いネジで箱ごと留め直す
    - バッテリーを、ポートのある短辺を右の開口に向けて 2 個重ねて差し込み、左右のスロットに面ファスナーか結束バンドを通して固定する
    - LiDAR をふたの柱に載せ、ふたの裏から M2.5 × 8 mm のネジ 4 本で留める（ふたを箱に付ける前に行う）
    - DROK を部品面を Pi 側に向けて箱の後ろの棚に立て、中央のリブの穴に結束バンドを通して締める（ふたを付ける前のほうが通しやすい）
    - ふたを M3 × 12 mm のネジ 4 本で箱のボスに留める
    - Camera Module 3 Wide を端子を下にして、先にフラットケーブルの 15 ピン側（太いほう）を差してから、板（cam_mount）の支柱に前から M2 × 6 mm で 4 本留める（ナットで留めるときは M2 × 8〜10 mm にして、ナットを板の裏の六角のくぼみに入れる。ナットとネジの先は、ふた・箱の前の面の逃げ穴 Ø6.5・深さ 4 mm に入るので、ふたの組み上げに当たらない）。板の裏をふたの前端の面に当て、左右の耳をふたの前端の柱に M3 × 8 mm で留める。ケーブルを LiDAR の前の柱の間からふたの上の結束バンド用ブリッジで通し、22 ピン側（細いほう）を Pi の CAM の口へ
    - Pi 5 に付けた M2.5 の六角支柱 4 本をラズパイ台のボスの丸い穴に 5 mm 差し込み、台の裏から M2.5 × 6 mm のネジで留める（台を天板に付ける前に行う）。ラズパイ台を天板の後ろ側 4 穴に長いネジで留める
    - IMU はピン下向き・ピンヘッダーの長辺を後ろ（Pi 側）にして、ジャンパー線を差したまま、後ろの開いた側から斜めに入れ、前の縁を前の壁の出っ張りの下に差し込んでから 3 辺の段に載せる（後ろの縁が浮く場合はテープかホットボンドで留める）。台はふたの上、LiDAR のヘッドの下の後ろの柱 2 本の間にあるので、LiDAR を付ける前に入れると楽
    - VL53L1X をバンパーの受けに入れ、バンパーを前後に重ねて共締めする
    - 上面カバーを、充電口が右（バッテリーのポート側）に来る向きで被せる。右側を先に斜めに入れて右前の固定の爪を天板の裏に掛け、左側をフックがカチッと掛かるまで押し下げる。外すときは左の指かけを外へ引きながら左側から持ち上げる
