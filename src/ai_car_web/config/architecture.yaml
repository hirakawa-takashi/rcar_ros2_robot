    - label: 組み立て図（カバー付き）
      note: 上の組み立て図に上面カバーを付けた状態
      plate: {size: [154, 200, 3], color: '#8fa3b8'}
      items:
        - {part: box}
        - {part: lid, translate: [0, 0, 38.4]}
