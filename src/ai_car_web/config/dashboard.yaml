dashboard_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 8080
    # 手動指令（Web + ゲームパッド）。drive_mode_node がモードに応じて /cmd_vel へ中継する
    cmd_vel_topic: "/cmd_vel_manual"
    scan_topic: "/scan"
    imu_topic: "/imu/data"
    odom_topic: "/odom"
    system_status_topic: "/system_status"
    camera_topic: "/camera/image_raw/compressed"
    stereo_depth_topic: "/stereo/depth_status"
    stereo_depth_image_topic: "/stereo/depth/compressed"
    # ブラウザへの MJPEG 配信レート（カメラ取り込み 15fps と同じ）
    camera_stream_rate: 30.0
    obstacle_topic: "/obstacle_status"
    obstacle_guard: true
    # LiDAR の取り付け向きの補正。画面の「前方」= 前方カメラの正面。カメラの画面の真ん中に置いたボトルが
    # LiDAR で右 4°・0.47 m に見えたことから求めた値（2026/10 実機で測定）。perception / autonomy も同じ値にする
    scan_angle_offset_deg: -1.7
    max_linear_speed: 0.3
    max_angular_speed: 1.0
    cmd_timeout: 0.7
    # CPU 負荷軽減のため画面更新 5Hz、LiDAR 点群は 360 点に間引き
    telemetry_rate: 10.0
    scan_max_points: 720
    # 40 ピンヘッダーの配線表。空なら share/ai_car_web/config/gpio_pins.yaml
    gpio_config: ""
    # Motor HAT の M1〜M4 と車輪の割り付け。空なら share/ai_car_web/config/motor_hat.yaml
    motor_hat_config: ""
    # プロジェクト説明の構成定義。空なら share/ai_car_web/config/architecture.yaml
    architecture_config: ""
    # 構成定義から参照する ROS パラメータ。空なら share/ai_car_web/config/dashboard.yaml
    params_config: ""
    # 開発日記（/api/dev_diary）で読む git リポジトリ。空ならインストール先を含むリポジトリ（ワークスペース）
    repo_dir: ""
    # ゲームパッドの正規化指令（joy_teleop_node）。この秒数以上途絶えると未接続表示
    joy_cmd_topic: "/joy_cmd"
    joy_timeout: 1.0
    drive_mode_topic: "/drive_mode"
    drive_mode_request_topic: "/drive_mode_request"
    api_token: ""  # 空なら認証なし。設定すると POST /api/* に X-API-Token（または Bearer）ヘッダーが必要。環境変数 AI_CAR_API_TOKEN でも指定可
    autonomy_status_topic: "/autonomy_status"
    cliff_topic: "/cliff_status"
    # SLAM（slam_toolbox、use_slam:=true）の地図・自己位置と、地図の保存先
    map_topic: "/map"
    slam_pose_topic: "/pose"
    slam_save_service: "/slam_toolbox/save_map"
    map_save_dir: "/home/super/AI-CAR_ws/maps"
    # Jetson（jetson/owl_detector）から POST /api/jetson/detections で受けた物体検出を流すトピック
    jetson_detections_topic: "/jetson_detections"

drive_mode_node:
  ros__parameters:
    # 運転モード（manual / auto / stop）を管理し、/cmd_vel を発行する唯一のノード
    cmd_vel_topic: "/cmd_vel"
    manual_topic: "/cmd_vel_manual"
    auto_topic: "/cmd_vel_auto"
    request_topic: "/drive_mode_request"
    mode_topic: "/drive_mode"
    obstacle_topic: "/obstacle_status"
    joy_cmd_topic: "/joy_cmd"
    initial_mode: "manual"
    publish_rate: 5.0
    auto_timeout: 0.5        # 自動指令が途絶えたら STOP
    manual_timeout: 1.0      # 手動指令が途絶えたら STOP
    obstacle_timeout: 2.0    # 障害物判定が途絶えたら LiDAR 停止とみなす
    joy_timeout: 1.0
    auto_requires_joy: true  # ゲームパッド切断で AUTO → STOP
    manual_override: true    # AUTO 中の手動指令で MANUAL へ復帰
    obstacle_guard: true     # 最終段で stop 判定中の前進を止める
    cliff_topic: "/cliff_status"
    cliff_guard: true        # 段差を検出した向き（前 / 後）への移動を止め、AUTO は STOP
    cliff_timeout: 1.0       # 段差判定がこれより古ければ使わない（配線済みなら AUTO を拒否 / STOP）

autonomy_node:
  ros__parameters:
    # Level 1: LiDAR 反応型（地図なし）。AUTO モードのときだけ /cmd_vel に中継される
    scan_topic: "/scan"
    obstacle_topic: "/obstacle_status"
    drive_mode_topic: "/drive_mode"
    cmd_topic: "/cmd_vel_auto"
    status_topic: "/autonomy_status"
    publish_rate: 10.0   # 判断周期 0.1s（停止距離 0.35m・巡航 0.15m/s に対して十分）
    scan_angle_offset_deg: -1.7   # dashboard_node と同じ値
    scan_max_age: 1.0
    cruise_speed: 0.15
    slow_speed: 0.08
    turn_speed: 0.6
    backoff_speed: 0.08
    front_angle_deg: 60.0
    stop_distance: 0.35
    slow_distance: 0.8
    clear_distance: 0.9
    backoff_distance: 0.25
    min_turn_sec: 0.6

joy_teleop_node:
  ros__parameters:
    # Logitech F710（背面スイッチ X = XInput モード）
    device: "/dev/input/js0"
    joy_cmd_topic: "/joy_cmd"
    publish_rate: 10.0
    deadzone: 0.15
    # 通常の出力割合。RB を押している間は全速
    speed_scale: 0.5
    axis_linear_x: 1    # 左スティック上下: 前進/後退
    axis_linear_y: 0    # 左スティック左右: 平行移動
    axis_angular_z: 3   # 右スティック左右: 旋回
    axis_dpad_x: 6
    axis_dpad_y: 7
    button_turbo: 5     # RB
    button_stop: 1      # B: 押している間は停止
    button_enable: -1   # デッドマンボタン（-1 で無効。例: 4 = LB）
    # 運転モード切替（drive_mode_node への要求）
    mode_request_topic: "/drive_mode_request"
    mode_topic: "/drive_mode"
    button_mode_toggle: 7   # START 長押しで手動 ⇄ 自動
    button_estop: 6         # BACK で即時停止
    mode_hold_sec: 2.0

seg_display_node:
  ros__parameters:
    # TM1637: VCC=17、GND=20、CLK=16(GPIO23)、DIO=18(GPIO24)
    gpio_chip: ""
    clk_gpio: 23
    dio_gpio: 24
    brightness: 2
    update_rate: 5.0
    system_status_topic: "/system_status"
    obstacle_topic: "/obstacle_status"
    joy_cmd_topic: "/joy_cmd"
    cmd_vel_topic: "/cmd_vel"
    state_topic: "/display_state"
    status_timeout: 3.0
    drive_mode_topic: "/drive_mode"
    # 表示コード: boot 起動待ち / rdy 待機 / HAnd 手動 / AUto 自動 / StoP 停止モード
    #             ObSt 障害物停止 / SLo 減速 / LoU 低電圧 / Err システム状態未受信

imu_node:
  ros__parameters:
    # GY-BNO055（I2C バス1、ADRピンHighでアドレス0x29）
    i2c_bus: 1
    i2c_address: 0x29
    frame_id: "imu_link"
    imu_topic: "/imu/data"
    publish_rate: 20.0

cliff_node:
  ros__parameters:
    # 落下防止センサー Dovhmoh VL53L1X ×2（前後バンパー、真下から進行方向へ 45° 前傾）。
    # 未配線の間は wired: false（I2C / GPIO に触らず「未配線」だけを配信）。配線したら true にする。
    # 初期アドレス 0x29 は BNO055 と同じなので、XSHUT を 1 台ずつ上げて 0x30 / 0x31 に変える
    wired: false
    i2c_bus: 1
    gpio_chip: ""            # 空なら pinctrl-rp1 を探す
    default_address: 0x29
    front_address: 0x30
    rear_address: 0x31
    front_xshut_gpio: 17     # pin 11
    rear_xshut_gpio: 27      # pin 13
    status_topic: "/cliff_status"
    publish_rate: 20.0
    timing_budget_ms: 33     # 短距離モード（〜1.3 m）: 15 / 20 / 33 / 50 / 100 / 200 / 500
    intermeasurement_ms: 40
    # 床までの距離の目安（センサーの中心は床から約 67 mm、45° なので測る距離は約 1.41 倍）。表示用
    floor_distance_m: 0.095
    # 測った距離がこれを超えたら段差（床が約 4 cm 下がった所）
    cliff_distance_m: 0.15
    invalid_is_cliff: true   # 床が見えない（測定無効）も段差とみなす
    confirm_count: 2         # 連続でこの回数超えたら段差
    stale_timeout: 0.5       # 測定値がこの秒数来なければ再接続

system_monitor_node:
  ros__parameters:
    publish_rate: 1.0
    topic: "/system_status"
    enable_pmic: true
    enable_hailo: true
    update_check_interval: 3600.0   # セキュリティ更新の数（apt-check）を調べる間隔 [秒]

perception_node:
  ros__parameters:
    scan_topic: "/scan"
    camera_topic: "/camera/image_raw/compressed"
    system_status_topic: "/system_status"
    obstacle_topic: "/obstacle_status"
    front_angle_deg: 60.0
    stop_distance: 0.35
    slow_distance: 0.8
    hef_path: "/home/super/AI-CAR_ws/models/yolov8m.hef"
    # 推論レート上限。CPU 負荷軽減のため 5Hz（検出確定は 3 フレーム中 2 回で約 0.4〜0.6s。YOLOv8m の実効上限は約 12Hz）
    inference_rate: 15.0
    score_threshold: 0.5
    detect_confirm_frames: 2
    detect_history_frames: 3
    # 2 眼カメラ（ELP、片目 1280x720 → 960x540）の横の画角。仮の値（広角レンズでゆがみがあるので実測して直す）。
    # Camera Module 3 に戻すときは 66.0
    camera_hfov_deg: 120.0
    scan_angle_offset_deg: -1.7   # dashboard_node と同じ値
    # LiDAR の回転中心から見たカメラのレンズ（使っている左目）の位置 [m]（x: 前、y: 左）。3D マウントの CAD 値（左 30 mm、前 79 mm。
    # 前はレンズの先、レンズの長さ 26 mm は実測）。LiDAR の点をこの位置に移して、カメラから見た方位と前方の距離で照合する（URDF の laser / camera_link と同じ値）
    camera_offset_x_m: 0.079
    camera_offset_y_m: 0.030
    scan_max_age: 1.0
    cluster_gap: 0.25
    danger_distance: 0.3
    # 物の枠の距離: 枠の真ん中の 2 眼のマスが 3 割以上測れていれば 2 眼の距離、だめなら（左はしなど）LiDAR の距離
    stereo_grid_topic: "/stereo/depth_grid"
    stereo_grid_min_ratio: 0.3
    # Jetson（jetson/owl_detector の NanoOWL）の物体検出。LiDAR の距離を付けて表示するだけ（速度は変えない）
    jetson_topic: "/jetson_detections"
    jetson_max_age: 2.0
    # 人・動物を見つけたら早めに減速・停止する。false の間は判定を表示するだけ（実機の準備ができたら true）
    living_guard: false
    living_labels: ["人", "犬", "猫", "鳥"]
    living_slow_distance: 1.5
    living_stop_distance: 0.6
    # 2 眼カメラの距離（stereo_depth_node）で見つけた低い障害物。false の間は判定を表示するだけ
    stereo_topic: "/stereo/depth_status"
    stereo_guard: false
    stereo_slow_distance: 0.8
    stereo_stop_distance: 0.45
    stereo_low_margin: 0.15
    # stereo_depth_node は約 3 回/秒なので、1 回分ぬけても切れないように
    stereo_max_age: 1.5
    cpu_temp_warn: 70.0
    cpu_temp_crit: 78.0
    hailo_temp_warn: 75.0
    hailo_temp_crit: 85.0
    # 実効スループット表示用（YOLOv8m 640x640 = 78.9 GOP / Hailo-8 公称 26 TOPS）
    model_gops: 78.9
    hailo_peak_tops: 26.0

rplidar:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
    serial_baudrate: 115200
    frame_id: "laser"
    angle_compensate: true

# USB の 2 眼カメラ（ELP 3D USB Camera）。dashboard.launch.py の camera_type:=stereo（既定）で起動
stereo_camera_node:
  ros__parameters:
    device: "/dev/v4l/by-id/usb-3D_USB_Camera_3D_USB_Camera_01.00.00-video-index0"
    # 左右を横に並べた MJPG（片目 1280x720）。30fps だと JPEG の展開と作り直しで CPU 約 108%、15fps で約 52%
    width: 2560
    height: 720
    fps: 15.0
    # 3D の板（cam_mount）に USB 端子を上にして付けているので回さない。上下逆さまに付けたときは true（左右の画像も入れ替わる）
    rotate_180: false
    eye: "left"
    output_width: 960
    output_height: 540
    jpeg_quality: 80
    image_topic: "/camera/image_raw/compressed"
    frame_id: "camera_link"
    # 距離の計算用に、左右を半分（片目 640x360）の白黒にして横に並べて出す。stereo_depth_node が受けているときだけ
    pair_topic: "/stereo/pair_gray"
    pair_rate: 3.0
    pair_scale: 0.5

# 2 眼カメラの左右の画像から距離を出す（表示だけ。走る・止まるの判断には使わない）
stereo_depth_node:
  ros__parameters:
    pair_topic: "/stereo/pair_gray"
    status_topic: "/stereo/depth_status"
    image_topic: "/stereo/depth/compressed"
    # 物の枠の距離用: 左目の画像を 32x18 のマスに分け、マスごとの前方の距離（中央値、4 m まで、4 画素おきの点が 6 点以上）
    grid_topic: "/stereo/depth_grid"
    grid_cols: 32
    grid_rows: 18
    grid_max_range_m: 4.0
    grid_min_points: 6
    # stereo_calibrate が書いた値（28 組、誤差 0.33 px、レンズの間隔 59.8 mm、2026/10）
    calib_file: "~/AI-CAR_ws/calib/stereo/stereo_calib.yaml"
    # 片目 640x360（焦点 約 210 px・間隔 0.06 m）で視差 0〜128 px → 近いほうは約 0.10 m まで測れる
    # （96 px だと約 0.14 m までで、0.12 m ののりの棒がまちがった遠い距離になった）。
    # そのかわり左はしの 128 px（約 42° より左）は測れず、計算は 96 px の約 1.4 倍
    num_disparities: 128
    block_size: 5
    uniqueness_ratio: 10
    speckle_window: 100
    speckle_range: 2
    # 床からの高さを出すためのカメラのレンズの床からの高さ（3D マウントの CAD 値）と下向きの角度
    camera_height_m: 0.112
    camera_pitch_deg: 0.0
    corridor_center_y_m: -0.038
    corridor_half_width_m: 0.15
    max_range_m: 2.0
    # 床より 2 cm 以上・60 cm 以下の点を物とみなす。40 点より少ないときは無視
    # （4 cm だと、0.23 m 先の高さ 約 3.4 cm の入れ物が床あつかいになった）
    min_height_m: 0.02
    max_height_m: 0.6
    # 0.6 m より近い物は、画像の上でつながりごとに分けて全部（5 個まで）映像に枠を出す
    near_objects_range_m: 0.6
    near_objects_max: 5
    min_points: 40
    # 距離の色の画像: 0.2 m が赤、3 m より遠いと青
    display_near_m: 0.2
    display_far_m: 3.0
    jpeg_quality: 70

# Camera Module 3（camera_ros）。camera_type:=picam のときだけ使う
camera:
  ros__parameters:
    format: "RGB888"
    # 960x540@15fps（1280x720@30fps は camera_node の CPU が約 50% になるため縮小・間引き）。
    # JPEG 品質は 95 だと帯域を食うため 80
    width: 960
    height: 540
    jpeg_quality: 80
    camera: 0
    # フレーム間隔の下限 / 上限（µs）。両方 66666 で 15fps 固定
    FrameDurationLimits: [33333, 33333]
    # 室内だと AE が露光を 33ms（1 フレーム分）まで伸ばして動体がぶれるため、
    # 露光だけ手動 8ms に固定し、明るさはアナログゲイン自動で合わせる
    ExposureTimeMode: 1
    ExposureTime: 8000
    AnalogueGainMode: 0
    # 高ゲイン時のノイズを抑える（Fast。JPEG サイズも約 2 割減る）
    NoiseReductionMode: 1
