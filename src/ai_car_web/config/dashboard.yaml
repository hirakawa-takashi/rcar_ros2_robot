dashboard_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 8080
    # 手動指令（Web + ゲームパッド）。drive_mode_node がモードに応じて /cmd_vel へ中継する
    cmd_vel_topic: "/cmd_vel_manual"
    scan_topic: "/scan"
    imu_topic: "/imu/data"
    mag_topic: "/imu/mag"
    odom_topic: "/odom"
    system_status_topic: "/system_status"
    camera_topic: "/camera/image_raw/compressed"
    stereo_depth_topic: "/stereo/depth_status"
    stereo_depth_image_topic: "/stereo/depth/compressed"
    # ブラウザへの MJPEG 配信レート（カメラ取り込み 15fps と同じ）
    camera_stream_rate: 30.0
    obstacle_topic: "/obstacle_status"
    # LiDAR の取り付け向きの補正。画面の「前方」= 前方カメラの正面。カメラの画面の真ん中に置いたボトルが
    # LiDAR で右 4°・0.47 m に見えたことから求めた値（2026/10 実機で測定）。perception / autonomy も同じ値にする
    scan_angle_offset_deg: -1.7
    max_linear_speed: 0.3
    max_angular_speed: 1.0
    cmd_timeout: 0.7
    # 「出力」の初期値（%）。手動（Web・ゲームパッド）は max_* × 出力、自動も drive_mode_node でこれ以下にする
    output_percent: 15.0
    drive_output_topic: "/drive_output"
    # CPU 負荷軽減のため画面更新 5Hz、LiDAR 点群は 360 点に間引き
    telemetry_rate: 10.0
    scan_max_points: 720
    # 40 ピンヘッダーの配線表。空なら share/ai_car_web/config/gpio_pins.yaml
    gpio_config: ""
    # Motor HAT の M1〜M4 と車輪の割り付け。空なら share/ai_car_web/config/motor_hat.yaml
    motor_hat_config: ""
    # プロジェクト説明の構成定義。空なら share/ai_car_web/config/architecture.yaml
    architecture_config: ""
    # 構成定義から参照する ROS パラメータ。空なら share/ai_car_web/config/dashboard.yaml
    params_config: ""
    # 開発日記（/api/dev_diary）で読む git リポジトリ。空ならインストール先を含むリポジトリ（ワークスペース）
    repo_dir: ""
    # ゲームパッドの正規化指令（joy_teleop_node）。この秒数以上途絶えると未接続表示
    joy_cmd_topic: "/joy_cmd"
    joy_timeout: 1.0
    drive_mode_topic: "/drive_mode"
    drive_mode_request_topic: "/drive_mode_request"
    nav_goal_topic: "/nav_goal"   # 地図の行き先（autonomy_node の Level 2）
    api_token: ""  # 空なら認証なし。設定すると POST /api/* に X-API-Token（または Bearer）ヘッダーが必要。環境変数 AI_CAR_API_TOKEN でも指定可
    autonomy_status_topic: "/autonomy_status"
    cliff_topic: "/cliff_status"
    # SLAM（slam_toolbox、use_slam:=true）の地図・自己位置と、地図の保存先
    map_topic: "/map"
    slam_pose_topic: "/pose"
    map_save_dir: "/home/super/AI-CAR_ws/maps"
    # Jetson（jetson/owl_detector）から POST /api/jetson/detections で受けた物体検出を流すトピック
    jetson_detections_topic: "/jetson_detections"

drive_mode_node:
  ros__parameters:
    # 運転モード（manual / auto / stop）を管理し、/cmd_vel を発行する唯一のノード
    cmd_vel_topic: "/cmd_vel"
    manual_topic: "/cmd_vel_manual"
    auto_topic: "/cmd_vel_auto"
    request_topic: "/drive_mode_request"
    mode_topic: "/drive_mode"
    obstacle_topic: "/obstacle_status"
    joy_cmd_topic: "/joy_cmd"
    initial_mode: "manual"
    publish_rate: 5.0
    auto_timeout: 0.5        # 自動指令が途絶えたら STOP
    manual_timeout: 1.0      # 手動指令が途絶えたら STOP
    obstacle_timeout: 2.0    # 障害物判定が途絶えたら LiDAR 停止とみなす
    joy_timeout: 1.0
    auto_requires_joy: true  # ゲームパッド切断で AUTO → STOP
    manual_override: true    # AUTO 中の手動指令で MANUAL へ復帰
    obstacle_guard: true     # 最終段で LiDAR 360°: 動く向き・回転に物が近ければ止める（手動は近づくと半分の速さ）
    cliff_topic: "/cliff_status"
    cliff_guard: true        # 段差を検出した向き（前 / 後）への移動を止め、AUTO は STOP
    cliff_timeout: 1.0       # 段差判定がこれより古ければ使わない（配線済みなら AUTO を拒否 / STOP）
    # ダッシュボードの「出力」で、どのモードでも |速さ| ≤ max_* × 出力（自動走行の上限）
    drive_output_topic: "/drive_output"
    default_output: 0.15     # 「出力」が届くまでの値
    max_linear_speed: 0.3    # dashboard_node と同じ値
    max_angular_speed: 1.0

motor_driver_node:
  ros__parameters:
    # /cmd_vel を Motor HAT の M1〜M4 に出す（メカナムの逆運動学、エンコーダーなしのオープンループ）
    cmd_vel_topic: "/cmd_vel"
    status_topic: "/motor_status"
    motor_hat_config: ""     # 空なら share/ai_car_web/config/motor_hat.yaml
    max_linear_speed: 0.3    # dashboard_node と同じ値。この速さで出力 100 %
    max_angular_speed: 1.0
    max_duty: 1.0            # 出力 100 % のときの PWM（0〜1）
    timeout: 0.5             # /cmd_vel がこの秒数届かないと止める
    # 旋回の指令が 0 で前後・左右に動くあいだ、IMU の向きを動き始めの向きに保つ（まっすぐ進む）
    heading_hold: true
    imu_topic: "/imu/data"
    heading_kp: 0.25         # 向きのずれ 1 rad（約 57°）あたりの旋回 [rad/s]。5° ずれると約 0.02 rad/s
    # 旋回の指令 0.15 で実際は約 1.3 rad/s 回る（約 9 倍）ので、強さは小さくしてある
    heading_kd: 0.05         # 回る速さを打ち消す強さ（ゆれ止め）
    heading_max_correction: 0.05  # 足す旋回の上限 [rad/s]
    heading_deadband_deg: 1.0  # このずれ [deg] までは直さない
    # heading_* は実行中に ros2 param set /motor_driver_node で変えられる
    imu_timeout: 0.5         # IMU がこの秒数届かないと向きを保たない

encoder_odom_node:
  ros__parameters:
    # 4 輪のエンコーダー（ピンは motor_hat.yaml）→ /odom と odom → base_footprint の TF
    odom_topic: "/odom"
    odom_frame: "odom"
    base_frame: "base_footprint"
    publish_tf: true
    motor_hat_config: ""     # 空なら share/ai_car_web/config/motor_hat.yaml
    gpio_chip: ""            # 空なら pinctrl-rp1 を探す
    publish_rate: 20.0
    counts_per_rev: 1408.0   # 車輪 1 回転のカウント（床で 1.8 m ≒ 10,000 カウントから。11 パルス × 4 逓倍 × 32 相当）
    wheel_radius: 0.0403     # メカナムホイール Ø80.59 mm
    wheel_base_half: 0.11    # 車体の中心から車輪の中心まで 前後
    track_half: 0.12         # 同 左右
    yaw_scale: 1.42          # その場回転はローラーがすべる。床で /odom 380° のとき実際 540°（1.5 回転）
    count_sign: -1           # モーターの正転でカウントが減る（2026/10/12 確認）

autonomy_node:
  ros__parameters:
    # Level 1: LiDAR 反応型（地図なし）。AUTO モードのときだけ /cmd_vel に中継される
    scan_topic: "/scan"
    obstacle_topic: "/obstacle_status"
    drive_mode_topic: "/drive_mode"
    cmd_topic: "/cmd_vel_auto"
    status_topic: "/autonomy_status"
    publish_rate: 10.0   # 判断周期 0.1s（停止距離 0.35m・巡航 0.15m/s に対して十分）
    scan_angle_offset_deg: -1.7   # dashboard_node と同じ値
    scan_max_age: 1.0
    cruise_speed: 0.15
    slow_speed: 0.08
    turn_speed: 0.6
    backoff_speed: 0.08
    front_angle_deg: 60.0
    stop_distance: 0.35
    slow_distance: 0.8
    clear_distance: 0.9
    backoff_distance: 0.25
    min_turn_sec: 0.6
    # 前の落下防止センサーが段差 → /odom で 0.10 m 下がり、空いている側へ 120° 回って走行を続ける
    cliff_topic: "/cliff_status"
    odom_topic: "/odom"
    cliff_timeout: 1.0
    odom_timeout: 0.5
    cliff_backoff_m: 0.10
    cliff_turn_deg: 120.0
    cliff_escape_timeout: 20.0   # 下がる・回るのそれぞれ。こえたら（前がまだ段差なら止まったまま）ふつうの走行へ
    # Level 2: ダッシュボードの地図の行き先（/nav_goal）へ Nav2 で向かう。Nav2 の速度（/cmd_vel_nav）を AUTO のときだけ中継
    nav_goal_topic: "/nav_goal"
    nav_cmd_topic: "/cmd_vel_nav"
    nav_plan_topic: "/plan"
    nav_frame: "map"
    nav_cmd_timeout: 0.5   # Nav2 の速度がこれより古ければゼロ
    nav_auto_wait: 5.0     # 「ここへ行く」から自動に入らないままこの秒数で行き先をやめる

joy_teleop_node:
  ros__parameters:
    # Logitech F710（背面スイッチ X = XInput モード）
    device: "/dev/input/js0"
    joy_cmd_topic: "/joy_cmd"
    publish_rate: 10.0
    deadzone: 0.15
    # スティックを倒しきったときの割合。1.0 = ダッシュボードの「出力」と同じ（RB は全速 = 同じ）
    speed_scale: 1.0
    axis_linear_x: 1    # 左スティック上下: 前進/後退
    axis_linear_y: 0    # 左スティック左右: 平行移動
    axis_angular_z: 3   # 右スティック左右: 旋回
    axis_dpad_x: 6
    axis_dpad_y: 7
    button_turbo: 5     # RB
    button_stop: 1      # B: 押している間は停止
    button_enable: -1   # デッドマンボタン（-1 で無効。例: 4 = LB）
    # 運転モード切替（drive_mode_node への要求）
    mode_request_topic: "/drive_mode_request"
    mode_topic: "/drive_mode"
    button_mode_toggle: 7   # START 長押しで手動 ⇄ 自動
    button_estop: 6         # BACK で即時停止
    mode_hold_sec: 2.0

seg_display_node:
  ros__parameters:
    # TM1637: VCC=17、GND=20、CLK=16(GPIO23)、DIO=18(GPIO24)
    gpio_chip: ""
    clk_gpio: 23
    dio_gpio: 24
    brightness: 2
    update_rate: 5.0
    system_status_topic: "/system_status"
    obstacle_topic: "/obstacle_status"
    joy_cmd_topic: "/joy_cmd"
    cmd_vel_topic: "/cmd_vel"
    state_topic: "/display_state"
    status_timeout: 3.0
    drive_mode_topic: "/drive_mode"
    # 表示コード: boot 起動待ち / rdy 待機 / HAnd 手動 / AUto 自動 / StoP 停止モード
    #             ObSt 障害物停止 / SLo 減速 / LoU 低電圧 / Err システム状態未受信

imu_node:
  ros__parameters:
    # GY-BNO055（I2C バス1、ADRピンHighでアドレス0x29）
    i2c_bus: 1
    i2c_address: 0x29
    frame_id: "imu_link"
    imu_topic: "/imu/data"
    # 磁気（sensor_msgs/MagneticField）。IMU モード（0x08）では BNO055 の磁気センサーが止まるので出さない
    mag_topic: "/imu/mag"
    publish_rate: 20.0
    # 基板の x が後ろ・y が右（z 軸まわりに 180°）なので、BNO055 の軸の割り当てで
    # x・y の符号を反転して imu_link（x 前・y 左・z 上）にそろえる
    axis_map_config: 0x24
    axis_map_sign: 0x06
    # 動作モード: 0x08 IMU（ジャイロ＋加速度、磁気なし）/ 0x0C NDOF（磁気も使う）。
    # 車の上では磁気が地磁気（約 46 µT）の 2〜3 倍（110〜150 µT）あり、止まっていても ±40 µT ゆれるので、
    # NDOF ではジャイロの補正も 0 から進まない。IMU にすると数秒でジャイロが 3 になる（向きは起動時からの相対）。
    # 0x07 AMG（3 つのセンサーの生の値）にすると磁気も読めて、向きは imu_node が計算する
    # （ジャイロ＋加速度の Mahony フィルター、磁気は使わない。ジャイロのずれは止まっているあいだに引く）。
    # AMG では BNO055 の補正の状態は出ないので、補正の保存もしない
    operation_mode: 0x07
    # AMG の向きの計算で、加速度で傾きを直す強さ（大きいほど早く直すが、ゆれに弱い）
    filter_gain: 1.0
    # 補正が 3 になったら（IMU はジャイロ・加速度、NDOF は磁気も）、補正値（0x55〜0x6A の 22 バイト）を保存し、
    # 次につないだとき動作モードに入る前に書きもどす（BNO055 は電源が切れると補正を忘れる）
    calibration_file: "~/.ros/bno055_calibration.json"
    calibration_save_interval: 600.0
    # 磁気の補正: ダッシュボードの「補正」で 30 秒のあいだ床でゆっくり 1〜2 回まわすと、x / y のずれと倍率を求めて保存する
    mag_calibration_file: "~/.ros/bno055_mag_calibration.json"
    mag_calibration_s: 30.0
    # 磁気はこの秒数のあいだ平均して出す（LiDAR は 1 秒に約 7 回まわるので、そのゆれをならす）
    mag_average_s: 1.0
    # 平均のあいだの磁気の強さのゆれがこれより大きい、または補正のときの強さから 30 % 以上ちがうと「乱れ」
    mag_disturb_ut: 5.0
    # 磁気で yaw を直す強さ（0 で使わない）。いまの IMU は LiDAR の約 10 mm 下で ±25 µT ゆれるので 0。
    # IMU を LiDAR から離して補正したら 0.05 くらいにする（yaw 0 = 磁北）
    mag_gain: 0.0

cliff_node:
  ros__parameters:
    # 落下防止センサー Dovhmoh VL53L1X ×2（前後バンパー、真下から進行方向へ 45° 前傾）。
    # wired: false の間は I2C / GPIO に触らず「未配線」だけを配信。front_wired / rear_wired で配線したほうだけを使う。
    # 初期アドレス 0x29 は BNO055 と同じなので、XSHUT を 1 台ずつ上げて 0x30 / 0x31 に変える
    wired: true
    front_wired: true
    rear_wired: true
    i2c_bus: 1
    gpio_chip: ""            # 空なら pinctrl-rp1 を探す
    default_address: 0x29
    front_address: 0x30
    rear_address: 0x31
    front_xshut_gpio: 17     # pin 11
    rear_xshut_gpio: 27      # pin 13
    status_topic: "/cliff_status"
    publish_rate: 20.0
    timing_budget_ms: 33     # 短距離モード（〜1.3 m）: 15 / 20 / 33 / 50 / 100 / 200 / 500
    intermeasurement_ms: 40
    # 高さ [cm] = (平らな床の距離 - 測った距離) × cos(tilt_deg) × 100。平らな床が 0.0 cm、低いほどマイナス
    tilt_deg: 45.0               # 真下から進行方向へのかたむき
    front_floor_distance_m: 0.087  # 前の平らな床までの距離（2026/10/17、付け直したあと 20 秒の実測 0.082〜0.091・中央 0.087）
    rear_floor_distance_m: 0.082   # 後の平らな床までの距離（同 0.077〜0.087・中央 0.082）
    cliff_height_cm: 2.0         # 床よりこれ以上低ければ段差（-2.0 cm 以下）
    invalid_is_cliff: true   # 床が見えない（測定無効）も段差とみなす
    confirm_count: 2         # 連続でこの回数超えたら段差
    stale_timeout: 0.5       # 測定値がこの秒数来なければ再接続

system_monitor_node:
  ros__parameters:
    publish_rate: 1.0
    topic: "/system_status"
    enable_pmic: true
    enable_hailo: true
    update_check_interval: 3600.0   # セキュリティ更新の数（apt-check）を調べる間隔 [秒]

perception_node:
  ros__parameters:
    scan_topic: "/scan"
    camera_topic: "/camera/image_raw/compressed"
    system_status_topic: "/system_status"
    obstacle_topic: "/obstacle_status"
    front_angle_deg: 60.0
    stop_distance: 0.35
    slow_distance: 0.8
    # 360° の見張り（drive_mode_node の obstacle_guard が使う）。車体の箱は LiDAR の中心から [後ろ, 前, 右, 左] の端 [m]
    # （battery_lidar_mount.scad / ai_car.xacro: 天板 200 x 154 mm + 前後のバンパー 32.8 mm + 車輪の外側まで。左は LiDAR の左 17 cm に出ている箱まで）
    body_box_m: [-0.176, 0.090, -0.135, 0.190]
    move_step_deg: 5.0
    move_side_margin: 0.03   # 通り道の左右に足すゆとり
    move_stop_gap: 0.25      # 動く向きの車体の端から物までがこれ以下で、その向きの動きを止める
    move_slow_gap: 0.7       # 手動ではこれ以下で半分の速さ
    turn_center_m: [-0.043, -0.008]  # その場で回る中心（天板の真ん中）
    turn_stop_deg: 5.0       # その向きに回れる角度がこれより小さいと、その向きの回転を止める（反対向きは回れる）
    # 物の名前を当てる YOLO（yolov8m.hef）は使わない。AI HAT+ は 1 眼の奥行きの AI だけに使う
    hef_path: ""
    # 推論レート上限（YOLO を使うとき。検出確定は 3 フレーム中 2 回。YOLOv8m の実効上限は約 12Hz）
    inference_rate: 15.0
    score_threshold: 0.5
    detect_confirm_frames: 2
    detect_history_frames: 3
    # Camera Module 3 Wide の横の画角（公称 102°。ふつうの Camera Module 3 は 66.0）
    camera_hfov_deg: 102.0
    scan_angle_offset_deg: -1.7   # dashboard_node と同じ値
    # LiDAR の回転中心から見たカメラのレンズの先の位置 [m]（x: 前、y: 左）。3D マウントの CAD 値（Camera Module 3 Wide は真ん前 63 mm）。
    # LiDAR の点をこの位置に移して、カメラから見た方位と前方の距離で照合する（URDF の laser / camera_link と同じ値）
    camera_offset_x_m: 0.063
    camera_offset_y_m: 0.0
    scan_max_age: 1.0
    cluster_gap: 0.25
    danger_distance: 0.3
    # 物の枠の距離のマス（/stereo/depth_grid）。出すノードがないので使わない（物の枠の距離は LiDAR）
    stereo_grid_topic: ""
    stereo_grid_min_ratio: 0.3
    # Jetson（jetson/owl_detector の NanoOWL）の物体検出。LiDAR の距離を付けて表示するだけ（速度は変えない）
    jetson_topic: "/jetson_detections"
    jetson_max_age: 2.0
    # 人・動物を見つけたら早めに減速・停止する。false の間は判定を表示するだけ（実機の準備ができたら true）
    living_guard: false
    living_labels: ["人", "犬", "猫", "鳥"]
    living_slow_distance: 1.5
    living_stop_distance: 0.6
    # 1 眼の奥行きの AI（下の mono_depth_*）で見つけた低い障害物（LiDAR の線より低い物）の判定。
    # 減速・停止に使うのは stereo_guard と mono_depth_guard の両方が true のときだけ（名前は前の 2 眼カメラのときのまま）
    stereo_topic: "/stereo/depth_status"
    stereo_guard: true
    stereo_slow_distance: 0.8
    stereo_stop_distance: 0.45
    stereo_low_margin: 0.15
    # 判定が届かなくなってから、古い値を使わなくなるまでの秒数
    stereo_max_age: 1.5
    # 1 眼の奥行きの AI（Hailo Model Zoo の SC-Depth v3、320x256、Hailo-8 で約 5.5 ms）。
    # 床の行の真ん中より 1.07 倍手前に見える所を物とし、物が床につく行から距離を出す。
    # /stereo/depth_status・/stereo/depth/compressed に出す（トピック名は前の 2 眼カメラのときのまま）。空で無効
    # 取得: https://hailo-model-zoo.s3.eu-west-2.amazonaws.com/ModelZoo/Compiled/v2.16.0/hailo8/scdepthv3.hef
    mono_depth_hef: "/home/super/AI-CAR_ws/models/scdepthv3.hef"
    mono_depth_rate: 15.0
    # まずは表示だけ（減速・停止には使わない）
    mono_depth_guard: false
    mono_camera_height_m: 0.100
    mono_camera_pitch_deg: 0.0
    # 車が傾いても距離がずれないよう、カメラの下向きの角度を毎回出す。LiDAR が当たった物
    # （0.3〜2 m）と床のさかい目の行を、カメラの高さと LiDAR の距離から出る行とくらべる。
    # AI は物の下のはしを床にとけこませるので、平らな床で出る -2.7° を引く（mono_pitch_bias_deg）。
    # 実機（10/12）: 平らな床で -0.5〜+0.3°、前輪の下に 7 mm で -4.1°（映像のずれでは -3.7°）
    mono_auto_pitch: true
    mono_pitch_bias_deg: -2.7
    mono_lidar_height_m: 0.175
    mono_nearer_ratio: 1.07
    mono_min_height_m: 0.02
    mono_fill_ratio: 0.5
    # 遠いと AI の奥行きが縮んで、床と物の差が小さくなるので 1 m まで
    mono_max_range_m: 1.0
    mono_min_columns: 3
    # Camera Module 3 Wide のレンズは車の真ん中より 8 mm 左
    mono_corridor_center_y_m: -0.008
    mono_corridor_half_width_m: 0.15
    # 物の出たり消えたりをおさえる。0.5 秒に 2 回見えたら出し、見えなくなっても 0.4 秒は出す。
    # 距離は最近 5 回の中央値（今のほうが近ければ今の値）
    mono_confirm_count: 2
    mono_confirm_window_s: 0.5
    mono_hold_s: 0.4
    cpu_temp_warn: 70.0
    cpu_temp_crit: 78.0
    hailo_temp_warn: 75.0
    hailo_temp_crit: 85.0
    # 実効スループット表示用（SC-Depth v3 320x256 = 10.7 GOP / Hailo-8 公称 26 TOPS）
    model_gops: 10.7
    hailo_peak_tops: 26.0

rplidar:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
    serial_baudrate: 115200
    frame_id: "laser"
    angle_compensate: true

# /scan が scan_timeout 秒来ないと rplidar を止め、launch の respawn（5 秒後）で起動し直す。
# USB が抜けて差し直されたとき、rplidar_ros は古いポートを握ったまま /scan を出さなくなるため
# usb_reset_after 回起動し直しても /scan が戻らなければ、rplidar を止めた後に LiDAR の USB をつなぎ直す
# （電池の電圧が下がった後、CP2102 が返事をしなくなり、起動し直しを 33 分で 81 回しても戻らなかった）。
# systemd/99-ai-car-lidar-usb.rules で dialout に /dev/bus/usb の書き込みを許す。0 でつなぎ直さない
lidar_watchdog_node:
  ros__parameters:
    scan_timeout: 3.0
    startup_grace: 15.0
    kill_wait: 3.0
    process_pattern: "rplidar_ros/rplidar_composition"
    usb_reset_after: 2
    usb_vendor_id: "10c4"
    usb_product_id: "ea60"
    # つなぎ直しでも戻らないと、power_cycle_after 回目から power_cycles 回、USB の電気を 3 秒切って入れ直す
    # （/usr/local/sbin/ai-car-usb-power-cycle、uhubctl。4 つの口が全部切れるのでゲームパッドも数秒切れる）。
    # CP2102 が固まると USBDEVFS_RESET では戻らず、2026-10-08 は約 10 時間 45 分 /scan が来なかった。
    # 1 回あたり 約 22 秒なので、固まってから 約 1.5 分で電気の入れ直し、約 2.5 分で再起動
    power_cycle_after: 4
    power_cycles: 2
    # それでも reboot_after 回続けばラズパイを再起動する。この起動で /scan が一度でも来ていて、
    # 起動から reboot_min_uptime 秒たっているときだけ（LiDAR がない・再起動でも直らないときにくり返さない）。0 でしない
    reboot_after: 7
    reboot_min_uptime: 1800.0

# Camera Module 3 Wide（camera_ros）。dashboard.launch.py の use_camera で起動
camera:
  ros__parameters:
    format: "RGB888"
    # 960x540@15fps（1280x720@30fps は camera_node の CPU が約 50% になるため縮小・間引き）。
    # JPEG 品質は 95 だと帯域を食うため 80
    width: 960
    height: 540
    jpeg_quality: 80
    camera: 0
    # センサーの読み方を 2304x1296（2x2 まとめ・全体）に決める。決めないと、960x540 には
    # 1536x864（真ん中だけ切り取り）が選ばれ、横の画角が 102° → 約 79° に狭くなる
    sensor_mode: "2304:1296"
    # フレーム間隔の下限 / 上限（µs）。両方 66666 で 15fps 固定
    FrameDurationLimits: [33333, 33333]
    # 室内だと AE が露光を 33ms（1 フレーム分）まで伸ばして動体がぶれるため、
    # 露光だけ手動 8ms に固定し、明るさはアナログゲイン自動で合わせる
    ExposureTimeMode: 1
    ExposureTime: 8000
    AnalogueGainMode: 0
    # 高ゲイン時のノイズを抑える（Fast。JPEG サイズも約 2 割減る）
    NoiseReductionMode: 1
