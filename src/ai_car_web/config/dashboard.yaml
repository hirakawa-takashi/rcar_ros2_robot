dashboard_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 8080
    cmd_vel_topic: "/cmd_vel"
    scan_topic: "/scan"
    imu_topic: "/imu/data"
    odom_topic: "/odom"
    system_status_topic: "/system_status"
    camera_topic: "/camera/image_raw/compressed"
    camera_stream_rate: 10.0
    obstacle_topic: "/obstacle_status"
    obstacle_guard: true
    # LiDAR は前方が機体後方を向く取り付けのため 180 度補正する
    scan_angle_offset_deg: 180.0
    max_linear_speed: 0.3
    max_angular_speed: 1.0
    cmd_timeout: 0.7
    telemetry_rate: 5.0

system_monitor_node:
  ros__parameters:
    publish_rate: 1.0
    topic: "/system_status"
    enable_pmic: true
    enable_hailo: true

perception_node:
  ros__parameters:
    scan_topic: "/scan"
    camera_topic: "/camera/image_raw/compressed"
    system_status_topic: "/system_status"
    obstacle_topic: "/obstacle_status"
    front_angle_deg: 60.0
    stop_distance: 0.35
    slow_distance: 0.8
    hef_path: "/home/super/AI-CAR_ws/models/yolov8n.hef"
    inference_rate: 4.0
    score_threshold: 0.4
    camera_hfov_deg: 66.0
    scan_angle_offset_deg: 180.0
    scan_max_age: 1.0
    cluster_gap: 0.25
    danger_distance: 0.3
    cpu_temp_warn: 70.0
    cpu_temp_crit: 78.0
    hailo_temp_warn: 75.0
    hailo_temp_crit: 85.0

rplidar:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
    serial_baudrate: 115200
    frame_id: "laser"
    angle_compensate: true

camera:
  ros__parameters:
    format: "RGB888"
    width: 640
    height: 480
    camera: 0
