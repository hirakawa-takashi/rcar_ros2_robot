dashboard_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 8080
    cmd_vel_topic: "/cmd_vel"
    scan_topic: "/scan"
    imu_topic: "/imu/data"
    odom_topic: "/odom"
    system_status_topic: "/system_status"
    camera_topic: "/camera/image_raw/compressed"
    camera_stream_rate: 30.0
    obstacle_topic: "/obstacle_status"
    obstacle_guard: true
    # LiDAR は前方が機体後方を向く取り付けのため 180 度補正する
    scan_angle_offset_deg: 180.0
    max_linear_speed: 0.3
    max_angular_speed: 1.0
    cmd_timeout: 0.7
    telemetry_rate: 10.0
    # 40 ピンヘッダーの配線表。空なら share/ai_car_web/config/gpio_pins.yaml
    gpio_config: ""
    # ゲームパッドの正規化指令（joy_teleop_node）。この秒数以上途絶えると未接続表示
    joy_cmd_topic: "/joy_cmd"
    joy_timeout: 1.0

joy_teleop_node:
  ros__parameters:
    # Logitech F710（背面スイッチ X = XInput モード）
    device: "/dev/input/js0"
    joy_cmd_topic: "/joy_cmd"
    publish_rate: 20.0
    deadzone: 0.15
    # 通常の出力割合。RB を押している間は全速
    speed_scale: 0.5
    axis_linear_x: 1    # 左スティック上下: 前進/後退
    axis_linear_y: 0    # 左スティック左右: 平行移動
    axis_angular_z: 3   # 右スティック左右: 旋回
    axis_dpad_x: 6
    axis_dpad_y: 7
    button_turbo: 5     # RB
    button_stop: 1      # B: 押している間は停止
    button_enable: -1   # デッドマンボタン（-1 で無効。例: 4 = LB）

seg_display_node:
  ros__parameters:
    # TM1637: VCC=17、GND=20、CLK=16(GPIO23)、DIO=18(GPIO24)
    gpio_chip: ""
    clk_gpio: 23
    dio_gpio: 24
    brightness: 2
    update_rate: 5.0
    system_status_topic: "/system_status"
    obstacle_topic: "/obstacle_status"
    joy_cmd_topic: "/joy_cmd"
    cmd_vel_topic: "/cmd_vel"
    state_topic: "/display_state"
    status_timeout: 3.0
    # 表示コード: boot 起動待ち / rdy 待機 / HAnd 手動 / ObSt 障害物停止
    #             SLo 減速 / LoU 低電圧 / Err システム状態未受信

imu_node:
  ros__parameters:
    # GY-BNO055（I2C バス1、ADRピンHighでアドレス0x29）
    i2c_bus: 1
    i2c_address: 0x29
    frame_id: "imu_link"
    imu_topic: "/imu/data"
    publish_rate: 50.0

system_monitor_node:
  ros__parameters:
    publish_rate: 1.0
    topic: "/system_status"
    enable_pmic: true
    enable_hailo: true

perception_node:
  ros__parameters:
    scan_topic: "/scan"
    camera_topic: "/camera/image_raw/compressed"
    system_status_topic: "/system_status"
    obstacle_topic: "/obstacle_status"
    front_angle_deg: 60.0
    stop_distance: 0.35
    slow_distance: 0.8
    hef_path: "/home/super/AI-CAR_ws/models/yolov8n.hef"
    inference_rate: 10.0
    score_threshold: 0.4
    camera_hfov_deg: 66.0
    scan_angle_offset_deg: 180.0
    scan_max_age: 1.0
    cluster_gap: 0.25
    danger_distance: 0.3
    cpu_temp_warn: 70.0
    cpu_temp_crit: 78.0
    hailo_temp_warn: 75.0
    hailo_temp_crit: 85.0
    # 実効スループット表示用（YOLOv8n 640x640 = 8.7 GOP / Hailo-8 公称 26 TOPS）
    model_gops: 8.7
    hailo_peak_tops: 26.0

rplidar:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
    serial_baudrate: 115200
    frame_id: "laser"
    angle_compensate: true

camera:
  ros__parameters:
    format: "RGB888"
    # 1280x720@30fps。JPEG 品質は 95 だと 1 枚 90KB 超で帯域を食うため 80 に下げる
    width: 1280
    height: 720
    jpeg_quality: 80
    camera: 0
    # 室内だと AE が露光を 33ms（1 フレーム分）まで伸ばして動体がぶれるため、
    # 露光だけ手動 8ms に固定し、明るさはアナログゲイン自動で合わせる
    ExposureTimeMode: 1
    ExposureTime: 8000
    AnalogueGainMode: 0
    # 高ゲイン時のノイズを抑える（Fast。JPEG サイズも約 2 割減る）
    NoiseReductionMode: 1
