# Raspberry Pi 5 40 ピンヘッダーの配線表。
# ダッシュボードの「GPIO 40ピンヘッダー」カードに反映される（dashboard_node 再起動で再読込）。
#
# 各項目:
#   pins   : 物理ピン番号のリスト（pin: 3 のように単数でも可）
#   device : 接続先（機器名）
#   signal : 信号名・用途
#   color  : 配線色（未確定なら空欄のまま。ヘッダー直挿しの HAT は PIN）
#   note   : 備考
connections:
  # --- Adafruit DC & Stepper Motor HAT（I2C 0x60、ヘッダーにスタック） ---
  - pins: [2, 4]
    device: Adafruit Motor HAT
    signal: 5V
    color: 赤
  - pins: [6]
    device: Adafruit Motor HAT
    signal: GND
    color: 黒
  - pins: [3]
    device: Adafruit Motor HAT
    signal: I2C SDA
    color: 青
    note: PCA9685 0x60
  - pins: [5]
    device: Adafruit Motor HAT
    signal: I2C SCL
    color: 黄
    note: PCA9685 0x60

  # --- モーターエンコーダー線（1 モーター 6 本のうち Encoder A / B の 2 本を Pi GPIO へ。
  #     VCC / GND は Motor HAT 上の 3V3 / GND ピンに挿すため Pi ヘッダー側は「空き」として扱い、ここには載せない。
  #     ピン・配線色は motor_hat.yaml と一致させる。Motor+ 赤 / Motor− 黒 は Motor HAT の M 端子へ、VCC 橙 / GND 白 は HAT 上の 3V3 / GND へ） ---
  - pins: [29]
    device: M1 前左
    signal: Encoder A (GPIO5)
    color: 黄
  - pins: [31]
    device: M1 前左
    signal: Encoder B (GPIO6)
    color: 緑
  - pins: [33]
    device: M2 前右
    signal: Encoder A (GPIO13)
    color: 黄
  - pins: [35]
    device: M2 前右
    signal: Encoder B (GPIO19)
    color: 緑
  - pins: [37]
    device: M3 後左
    signal: Encoder A (GPIO26)
    color: 黄
  - pins: [32]
    device: M3 後左
    signal: Encoder B (GPIO12)
    color: 緑
  - pins: [36]
    device: M4 後右
    signal: Encoder A (GPIO16)
    color: 黄
  - pins: [38]
    device: M4 後右
    signal: Encoder B (GPIO20)
    color: 緑

  # --- GY-BNO055 9軸 IMU（I2C 0x29） ---
  - pins: [1]
    device: GY-BNO055 IMU
    signal: 3V3
    color: 赤
  - pins: [9]
    device: GY-BNO055 IMU
    signal: GND
    color: 黒
  - pins: [3]
    device: GY-BNO055 IMU
    signal: I2C SDA
    color: 白
    note: アドレス 0x29（Motor HAT と I2C バス共有）
  - pins: [5]
    device: GY-BNO055 IMU
    signal: I2C SCL
    color: 灰
    note: アドレス 0x29（Motor HAT と I2C バス共有）

  # --- Raspberry Pi AI HAT+（PCIe 接続。ヘッダーは電源と ID EEPROM のみ使用） ---
  - pins: [27]
    device: AI HAT+
    signal: ID_SD (HAT EEPROM)
    color: PIN
  - pins: [28]
    device: AI HAT+
    signal: ID_SC (HAT EEPROM)
    color: PIN

  # --- ZJY-IPS130-V2.0 1.3インチ 240x240 IPS 液晶（ST7789、SPI0、7 ピン CS なし）
  #     旧 TM1637 7セグ（pin 17/20/16/18）を置き換え ---
  - pins: [17]
    device: ZJY-IPS130 液晶
    signal: VCC 3V3
    color: 赤
  - pins: [20]
    device: ZJY-IPS130 液晶
    signal: GND
    color: 黒
  - pins: [23]
    device: ZJY-IPS130 液晶
    signal: SCL (GPIO11 SPI0 SCLK)
    color: 橙
  - pins: [19]
    device: ZJY-IPS130 液晶
    signal: SDA (GPIO10 SPI0 MOSI)
    color: 黄
  - pins: [18]
    device: ZJY-IPS130 液晶
    signal: RES (GPIO24)
    color: 緑
    note: libgpiod 出力（gpiochip4 pinctrl-rp1）
  - pins: [22]
    device: ZJY-IPS130 液晶
    signal: DC (GPIO25)
    color: 青
    note: libgpiod 出力（gpiochip4 pinctrl-rp1）
  - pins: [16]
    device: ZJY-IPS130 液晶
    signal: BLK (GPIO23)
    color: 紫
    note: バックライト。libgpiod 出力（gpiochip4 pinctrl-rp1）
