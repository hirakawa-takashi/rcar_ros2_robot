# Raspberry Pi 5 40 ピンヘッダーの配線表。
# ダッシュボードの「GPIO 40ピンヘッダー」カードに反映される（dashboard_node 再起動で再読込）。
#
# 各項目:
#   pins   : 物理ピン番号のリスト（pin: 3 のように単数でも可）
#   device : 接続先（機器名）
#   signal : 信号名・用途
#   color  : 配線色（未確定なら空欄のまま。ヘッダー直挿しの HAT は PIN）
#   note   : 備考
connections:
  # --- Adafruit DC & Stepper Motor HAT（I2C 0x60、ヘッダーにスタック） ---
  - pins: [2, 4]
    device: Adafruit Motor HAT
    signal: 5V
    color: 赤
  - pins: [6]
    device: Adafruit Motor HAT
    signal: GND
    color: 黒
  - pins: [3]
    device: Adafruit Motor HAT
    signal: I2C SDA
    color: 青
    note: PCA9685 0x60
  - pins: [5]
    device: Adafruit Motor HAT
    signal: I2C SCL
    color: 黄
    note: PCA9685 0x60

  # --- GY-BNO055 9軸 IMU（I2C 0x29） ---
  - pins: [1]
    device: GY-BNO055 IMU
    signal: 3V3
    color: 赤
  - pins: [9]
    device: GY-BNO055 IMU
    signal: GND
    color: 黒
  - pins: [3]
    device: GY-BNO055 IMU
    signal: I2C SDA
    color: 白
    note: アドレス 0x29（Motor HAT と I2C バス共有）
  - pins: [5]
    device: GY-BNO055 IMU
    signal: I2C SCL
    color: 灰
    note: アドレス 0x29（Motor HAT と I2C バス共有）

  # --- Raspberry Pi AI HAT+（PCIe 接続。ヘッダーは電源と ID EEPROM のみ使用） ---
  - pins: [27]
    device: AI HAT+
    signal: ID_SD (HAT EEPROM)
    color: PIN
  - pins: [28]
    device: AI HAT+
    signal: ID_SC (HAT EEPROM)
    color: PIN

  # --- TM1637 4桁7セグLED ---
  - pins: [17]
    device: TM1637 4桁7セグLED
    signal: 3V3
    color: オレンジ
  - pins: [20]
    device: TM1637 4桁7セグLED
    signal: GND
    color: 黒
  - pins: [16]
    device: TM1637 4桁7セグLED
    signal: CLK (GPIO23)
    color: 黄
    note: bit-bang（libgpiod, gpiochip4 pinctrl-rp1）
  - pins: [18]
    device: TM1637 4桁7セグLED
    signal: DIO (GPIO24)
    color: 緑
    note: bit-bang（libgpiod, gpiochip4 pinctrl-rp1）

  # --- ZJY-IPS130 1.3インチ IPS 液晶（ST7789、240x240、SPI、7 ピン: GND/VCC/SCL/SDA/RES/DC/BLK。表示ノードは未実装） ---
  # SCL/SDA は SPI0 に固定。RES/DC/BLK は空き GPIO を仮割り当て（実配線に合わせて変更する）。
  - pins: [25]
    device: ZJY-IPS130 液晶
    signal: GND
    color: 黒
  - pins: [17]
    device: ZJY-IPS130 液晶
    signal: VCC (3V3)
    color: 赤
    note: TM1637 と 3V3 共有
  - pins: [23]
    device: ZJY-IPS130 液晶
    signal: SCL (SPI0 SCLK / GPIO11)
    color: 橙
  - pins: [19]
    device: ZJY-IPS130 液晶
    signal: SDA (SPI0 MOSI / GPIO10)
    color: 黄
  - pins: [22]
    device: ZJY-IPS130 液晶
    signal: RES (GPIO25)
    color: 緑
    note: 仮割り当て
  - pins: [15]
    device: ZJY-IPS130 液晶
    signal: DC (GPIO22)
    color: 青
    note: 仮割り当て
  - pins: [13]
    device: ZJY-IPS130 液晶
    signal: BLK (GPIO27)
    color: 紫
    note: 仮割り当て（バックライト、常時 ON なら 3V3 直結でも可）
