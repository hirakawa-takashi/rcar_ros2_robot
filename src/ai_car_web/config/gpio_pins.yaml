# Raspberry Pi 5 40 ピンヘッダーの配線表。
# ダッシュボードの「GPIO 40ピンヘッダー」カードに反映される（dashboard_node 再起動で再読込）。
#
# 各項目:
#   pins   : 物理ピン番号のリスト（pin: 3 のように単数でも可）
#   device : 接続先（機器名）
#   signal : 信号名・用途
#   color  : 配線色（未確定なら空欄のまま）
#   note   : 備考
#
# AI HAT+（PCIe）と Adafruit Motor HAT（I2C 0x60）はピンに直接挿していないので、この表には載せない。
# Motor HAT の配線は motor_hat.yaml（Motor HAT 接続図）。
connections:
  # --- モーターエンコーダー線（1 モーター 6 本のうち Encoder A / B の 2 本を Pi GPIO へ。
  #     VCC / GND は Motor HAT (3V3 power) / Motor HAT (Ground) に挿すため Pi ヘッダー側は「空き」として扱い、ここには載せない。
  #     ピン・配線色は motor_hat.yaml と一致させる。Motor+ 黒 / Motor− 赤 は Motor HAT の M 端子へ、
  #     VCC 白 / GND 黄 は Motor HAT (3V3 power) / Motor HAT (Ground) へ） ---
  - pins: [29]
    device: M1 前左
    signal: Encoder A (GPIO5)
    color: 橙
  - pins: [31]
    device: M1 前左
    signal: Encoder B (GPIO6)
    color: 緑
  - pins: [33]
    device: M2 前右
    signal: Encoder A (GPIO13)
    color: 橙
  - pins: [35]
    device: M2 前右
    signal: Encoder B (GPIO19)
    color: 緑
  - pins: [37]
    device: M3 後左
    signal: Encoder A (GPIO26)
    color: 橙
  - pins: [32]
    device: M3 後左
    signal: Encoder B (GPIO12)
    color: 緑
  - pins: [36]
    device: M4 後右
    signal: Encoder A (GPIO16)
    color: 橙
  - pins: [38]
    device: M4 後右
    signal: Encoder B (GPIO20)
    color: 緑

  # --- GY-BNO055 9軸 IMU（I2C 0x29） ---
  - pins: [1]
    device: GY-BNO055 IMU
    signal: 3V3
    color: 赤
  - pins: [9]
    device: GY-BNO055 IMU
    signal: GND
    color: 黒
  - pins: [3]
    device: GY-BNO055 IMU
    signal: I2C SDA
    color: 白
    note: アドレス 0x29（Motor HAT と I2C バス共有）
  - pins: [5]
    device: GY-BNO055 IMU
    signal: I2C SCL
    color: 灰
    note: アドレス 0x29（Motor HAT と I2C バス共有）

  # --- 落下防止センサー Dovhmoh VL53L1X ×2（I2C 0x30 前 / 0x31 後）。未配線・配線色は未定（color は空欄）
  #     初期アドレス 0x29 は BNO055 と同じ。XSHUT を GPIO で 1 台ずつ上げ、cliff_node が起動時に変更する。
  #     前の 3V3（pin 1）は IMU と分岐して使う ---
  - pins: [1]
    device: VL53L1X 前
    signal: VIN 3V3
    color: ''
    note: 未配線・配線色未定（IMU と分岐）
  - pins: [14]
    device: VL53L1X 前
    signal: GND
    color: ''
    note: 未配線・配線色未定
  - pins: [3]
    device: VL53L1X 前
    signal: I2C SDA
    color: ''
    note: 未配線・配線色未定。アドレス 0x30（I2C バス共有）
  - pins: [5]
    device: VL53L1X 前
    signal: I2C SCL
    color: ''
    note: 未配線・配線色未定。アドレス 0x30（I2C バス共有）
  - pins: [11]
    device: VL53L1X 前
    signal: XSHUT (GPIO17)
    color: ''
    note: 未配線・配線色未定。libgpiod 出力（gpiochip4 pinctrl-rp1）
  - pins: [17]
    device: VL53L1X 後
    signal: VIN 3V3
    color: ''
    note: 未配線・配線色未定
  - pins: [25]
    device: VL53L1X 後
    signal: GND
    color: ''
    note: 未配線・配線色未定
  - pins: [3]
    device: VL53L1X 後
    signal: I2C SDA
    color: ''
    note: 未配線・配線色未定。アドレス 0x31（I2C バス共有）
  - pins: [5]
    device: VL53L1X 後
    signal: I2C SCL
    color: ''
    note: 未配線・配線色未定。アドレス 0x31（I2C バス共有）
  - pins: [13]
    device: VL53L1X 後
    signal: XSHUT (GPIO27)
    color: ''
    note: 未配線・配線色未定。libgpiod 出力（gpiochip4 pinctrl-rp1）
